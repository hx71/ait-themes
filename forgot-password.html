<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - AIT Themes</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#2563eb', // Blue-600
                        secondary: '#4f46e5', // Indigo-600
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS for Animations -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body
    class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-50 font-sans antialiased overflow-x-hidden transition-colors duration-300 min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">

    <!-- Decorative Background Elements -->
    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
        <div
            class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-blue-400/20 dark:bg-blue-600/10 blur-[100px]">
        </div>
        <div
            class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-indigo-400/20 dark:bg-indigo-600/10 blur-[100px]">
        </div>
    </div>

    <div class="sm:mx-auto sm:w-full sm:max-w-md reveal">

        <!-- Logo -->
        <a href="index.html"
            class="flex items-center justify-center gap-2 cursor-pointer hover:opacity-80 transition-opacity mb-8">
            <div
                class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-blue-500/30">
                A
            </div>
            <span class="font-bold text-2xl tracking-tight text-slate-900 dark:text-white">AIT Themes</span>
        </a>

        <h2 class="text-center text-3xl font-bold tracking-tight text-slate-900 dark:text-white">
            Forgot password?
        </h2>
        <p class="mt-2 text-center text-sm text-slate-600 dark:text-slate-400">
            Enter your email and we'll send you a link to reset your password.
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md reveal delay-100">
        <div
            class="bg-white dark:bg-slate-800 py-8 px-4 shadow-xl border border-slate-200/50 dark:border-slate-700/50 sm:rounded-[2rem] sm:px-10">
            <form id="forgotPasswordForm" class="space-y-6" action="#" method="POST">
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">
                        Email Address
                    </label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="mail" class="h-5 w-5 text-slate-400"></i>
                        </div>
                        <input id="email" name="email" type="email" autocomplete="email" required
                            class="block w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                            placeholder="name@email.com">
                    </div>
                </div>

                <div id="successMessage"
                    class="hidden text-sm text-emerald-600 font-medium bg-emerald-50 dark:bg-emerald-500/10 p-3 rounded-xl border border-emerald-200 dark:border-emerald-500/30 flex items-start gap-2 transition-all">
                    <i data-lucide="check-circle-2" class="w-5 h-5 shrink-0 mt-0.5"></i>
                    <span>If that email is registered, we have sent instructions to reset your password.</span>
                </div>

                <div>
                    <button type="submit"
                        class="w-full flex justify-center py-3.5 px-4 rounded-xl shadow-lg shadow-blue-500/30 text-sm font-medium text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-300 transform hover:-translate-y-0.5">
                        Send Reset Link
                    </button>
                </div>
            </form>

            <div class="mt-6 text-center sm:hidden">
                <a href="login.html"
                    class="font-medium text-sm text-blue-600 hover:text-blue-500 dark:text-blue-400 dark:hover:text-blue-300 transition-colors">
                    Back to sign in
                </a>
            </div>
        </div>
    </div>

    <!-- Dark Mode Toggle -->
    <button id="theme-toggle-login"
        class="fixed bottom-8 right-8 p-3 rounded-full bg-white dark:bg-slate-800 shadow-lg border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition-all z-50">
        <i data-lucide="moon" id="theme-icon-dark-login" class="w-5 h-5 hidden"></i>
        <i data-lucide="sun" id="theme-icon-light-login" class="w-5 h-5"></i>
    </button>

    <script src="assets/js/main.js"></script>
    <script>
        // Dark Mode Logic
        const htmlLogin = document.documentElement;
        const loginToggleBtn = document.getElementById('theme-toggle-login');
        const iconDark = document.getElementById('theme-icon-dark-login');
        const iconLight = document.getElementById('theme-icon-light-login');

        loginToggleBtn.addEventListener('click', () => {
            htmlLogin.classList.toggle('dark');
            const isDark = htmlLogin.classList.contains('dark');
            localStorage.setItem('color-theme', isDark ? 'dark' : 'light');
            iconDark.classList.toggle('hidden', !isDark);
            iconLight.classList.toggle('hidden', isDark);
        });

        // Simulation Form Submit
        document.getElementById('forgotPasswordForm').addEventListener('submit', function (e) {
            e.preventDefault();
            document.getElementById('successMessage').classList.remove('hidden');
        });
    </script>
</body>

</html>
