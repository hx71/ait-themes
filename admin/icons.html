<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icons Preview - AIT Themes</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#2563eb', // Blue-600
                        secondary: '#4f46e5', // Indigo-600
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS for Scrollbars & Animations -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .sidebar-item-active {
            background-color: #eff6ff;
            color: #2563eb;
            font-weight: 600;
            border-left: 4px solid #2563eb;
        }
        .dark .sidebar-item-active {
            background-color: rgba(37, 99, 235, 0.15);
            color: #60a5fa;
            border-left: 4px solid #3b82f6;
        }

<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-50 font-sans antialiased transition-colors duration-300">

            </div>

            <!-- ================= CONTROL & CUSTOMIZE PANEL ================= -->
            <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200/50 dark:border-slate-700/50 shadow-sm space-y-6">
                
                <!-- Live Customizer Parameters -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Parameter 1: Stroke Width Slider -->
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Icon Stroke Width</label>
                            <span id="stroke-value" class="text-xs font-mono font-bold text-blue-600 dark:text-blue-400">2.0px</span>
                        </div>
                        <input id="stroke-slider" type="range" min="1" max="3" step="0.5" value="2" oninput="changeStrokeWidth(this.value)" class="w-full h-1.5 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-600">
                    </div>

                    <!-- Parameter 2: Color Predefined Toggles -->
                    <div>
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Icon Theme Color</label>
                        <div class="flex items-center gap-2.5">
                            <button onclick="changeIconColor('text-blue-600 dark:text-blue-400')" class="w-7 h-7 rounded-full bg-blue-600 border-2 border-white dark:border-slate-800 hover:scale-110 active:scale-95 transition-all shadow-md"></button>
                            <button onclick="changeIconColor('text-indigo-600 dark:text-indigo-400')" class="w-7 h-7 rounded-full bg-indigo-600 border-2 border-white dark:border-slate-800 hover:scale-110 active:scale-95 transition-all shadow-md"></button>
                            <button onclick="changeIconColor('text-emerald-600 dark:text-emerald-400')" class="w-7 h-7 rounded-full bg-emerald-600 border-2 border-white dark:border-slate-800 hover:scale-110 active:scale-95 transition-all shadow-md"></button>
                            <button onclick="changeIconColor('text-violet-600 dark:text-violet-400')" class="w-7 h-7 rounded-full bg-violet-600 border-2 border-white dark:border-slate-800 hover:scale-110 active:scale-95 transition-all shadow-md"></button>
                            <button onclick="changeIconColor('text-rose-600 dark:text-rose-400')" class="w-7 h-7 rounded-full bg-rose-600 border-2 border-white dark:border-slate-800 hover:scale-110 active:scale-95 transition-all shadow-md"></button>
                            <button onclick="changeIconColor('text-slate-700 dark:text-slate-200')" class="w-7 h-7 rounded-full bg-slate-700 dark:bg-slate-200 border-2 border-white dark:border-slate-800 hover:scale-110 active:scale-95 transition-all shadow-md" title="Default Theme"></button>
                        </div>
                    </div>

                    <!-- Parameter 3: Search Bar -->
                    <div class="relative">
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Search Icons</label>
                        <div class="relative w-full">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i data-lucide="search" class="w-4 h-4"></i>
                            </span>
                            <input id="icon-search" type="text" oninput="handleSearch(this.value)" placeholder="Search icons by name..." class="block w-full pl-9 pr-4 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">

    <script>
        function closeSidebar() {
            const mobileSidebar = document.getElementById('mobile-sidebar');
            const backdrop = document.getElementById('mobile-sidebar-backdrop');
            if (mobileSidebar && backdrop) {
                mobileSidebar.classList.add('-translate-x-full');
                backdrop.classList.remove('opacity-100');
                setTimeout(() => { backdrop.classList.add('hidden'); }, 300);
            }
        }

        function toggleSidebarMinimize() {
            const body = document.body;
            body.classList.toggle('sidebar-minimized');
            
            const isMinimized = body.classList.contains('sidebar-minimized');
            localStorage.setItem('sidebar-minimized', isMinimized ? 'true' : 'false');
            
            const icon = document.getElementById('minimize-icon');
            if (icon) {
                icon.setAttribute('data-lucide', isMinimized ? 'chevron-right' : 'chevron-left');
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }
        }

        function initAdminControls() {
            lucide.createIcons();
            const openMobileBtn = document.getElementById('open-mobile-sidebar-btn');
            const closeMobileBtn = document.getElementById('close-mobile-sidebar-btn');
            const mobileSidebar = document.getElementById('mobile-sidebar');
            const backdrop = document.getElementById('mobile-sidebar-backdrop');

            if (openMobileBtn) openMobileBtn.addEventListener('click', () => {
                mobileSidebar.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
                setTimeout(() => { backdrop.classList.add('opacity-100'); }, 10);
            });
            if (closeMobileBtn) closeMobileBtn.addEventListener('click', closeSidebar);
            if (backdrop) backdrop.addEventListener('click', closeSidebar);

            // Dark Mode Logic
            const htmlElement = document.documentElement;
            const themeBtn = document.getElementById('theme-toggle');
            
            if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                htmlElement.classList.add('dark');
                updateThemeIcons('dark');
            } else {
                htmlElement.classList.remove('dark');
                updateThemeIcons('light');
            }

            function updateThemeIcons(theme) {
                const iconDark = document.getElementById('theme-icon-dark');
                const iconLight = document.getElementById('theme-icon-light');
                if (theme === 'dark') {
                    if (iconDark) iconDark.classList.remove('hidden');
                    if (iconLight) iconLight.classList.add('hidden');
                } else {
                    if (iconDark) iconDark.classList.add('hidden');
                    if (iconLight) iconLight.classList.remove('hidden');
                }
            }

            if (themeBtn) {
                themeBtn.addEventListener('click', () => {
                    let activeTheme = 'light';
                    if (htmlElement.classList.contains('dark')) {
                        htmlElement.classList.remove('dark');
                        localStorage.setItem('color-theme', 'light');
                    } else {
                        htmlElement.classList.add('dark');
                        localStorage.setItem('color-theme', 'dark');
                        activeTheme = 'dark';
                    }
                    updateThemeIcons(activeTheme);
                });
            }
        }

        function initPage(tabId) {
            const titleMap = {
                'overview': 'Analytics Overview',
                'themes': 'Digital Themes Management',
                'users': 'User Management',
                'transactions': 'Transaction History Log',
                'settings': 'Dashboard Settings',
                'form': 'Form Elements Preview',
                'form-wizard': 'Form Wizard Stepper',
                'form-editor': 'Form Editor Preview',
                'select': 'Select Elements Preview',
                'datepicker': 'Date & Time Pickers',
                'modal': 'Interactive Modals Preview',
                'alert': 'Alert Panels & Badges',
                'table': 'Paginated Data Table',
                'icons': 'Icons View'
            };
            
            const pageTitle = document.getElementById('page-title');
            if (pageTitle) {
                pageTitle.innerText = titleMap[tabId] || 'Dashboard';
            }

            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach(btn => {
                if (btn.getAttribute('data-tab') === tabId) {
                    btn.classList.add('sidebar-item-active');
                } else {
                    btn.classList.remove('sidebar-item-active');
                }
            });
        }

        // DATABASE SIMULATION
        const initialUsers = [
            { name: 'Hasrul', email: 'hasrul@aitthemes.com', role: 'Admin', status: 'Active', date: '2026-01-10', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=64&q=80' }
        ];

        function getDB(key, defaults) {
            if (!localStorage.getItem(key)) {
                localStorage.setItem(key, JSON.stringify(defaults));
            }
            return JSON.parse(localStorage.getItem(key));
        }

        let users = getDB('ait_users', initialUsers);

        function initProfileDisplay() {
            const adminUser = users.find(u => u.role === 'Admin') || users[0];
            const userName = adminUser.name;
            const userAvatar = adminUser.avatar;

            document.getElementById('mobile-user-name').innerText = userName;
            document.getElementById('desktop-user-name').innerText = userName;
            document.getElementById('header-user-name').innerText = userName;
            
            document.getElementById('mobile-user-avatar').src = userAvatar;
            document.getElementById('desktop-user-avatar').src = userAvatar;
            document.getElementById('header-user-avatar').src = userAvatar;
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-2xl shadow-xl flex items-center gap-3 bg-white dark:bg-slate-800 border border-slate-200/50 dark:border-slate-700/50 text-slate-800 dark:text-white text-sm pointer-events-auto fade-in transition-all duration-300`;
            
            let iconMarkup = '';
            if (type === 'success') {
                iconMarkup = `<div class="w-8 h-8 rounded-xl bg-emerald-100 dark:bg-emerald-950 flex items-center justify-center text-emerald-600 dark:text-emerald-400 shrink-0"><i data-lucide="check-circle" class="w-5 h-5"></i></div>`;
            } else if (type === 'warning') {
                iconMarkup = `<div class="w-8 h-8 rounded-xl bg-amber-100 dark:bg-amber-950 flex items-center justify-center text-amber-600 dark:text-amber-400 shrink-0"><i data-lucide="alert-triangle" class="w-5 h-5"></i></div>`;
            } else {
                iconMarkup = `<div class="w-8 h-8 rounded-xl bg-rose-100 dark:bg-rose-950 flex items-center justify-center text-rose-600 dark:text-rose-400 shrink-0"><i data-lucide="alert-circle" class="w-5 h-5"></i></div>`;
            }

            toast.innerHTML = `
                ${iconMarkup}
                <div class="flex-1 font-medium">${message}</div>
                <button class="text-slate-400 hover:text-slate-600 dark:hover:text-white" onclick="this.parentElement.remove()">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            `;

            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => { toast.remove(); }, 300);
            }, 4000);
        }

            { name: 'arrow-left', category: 'Arrows & Directions' },
            { name: 'arrow-right', category: 'Arrows & Directions' },
            { name: 'chevron-up', category: 'Arrows & Directions' },
            { name: 'chevron-down', category: 'Arrows & Directions' },
            { name: 'chevron-left', category: 'Arrows & Directions' },
            { name: 'chevron-right', category: 'Arrows & Directions' },
            { name: 'external-link', category: 'Arrows & Directions' },
            { name: 'move', category: 'Arrows & Directions' },

            // Category: Social & Communication
            { name: 'message-square', category: 'Social & Communication' },
            { name: 'phone', category: 'Social & Communication' },
            { name: 'share-2', category: 'Social & Communication' },
            { name: 'thumbs-up', category: 'Social & Communication' },
            { name: 'thumbs-down', category: 'Social & Communication' },
            { name: 'heart', category: 'Social & Communication' },
            { name: 'users', category: 'Social & Communication' },
            { name: 'send', category: 'Social & Communication' },
            { name: 'globe', category: 'Social & Communication' },
            { name: 'hash', category: 'Social & Communication' }
        ];

        let activeCategory = 'All';
        let searchQuery = '';
        let currentStrokeWidth = 2.0;
        let activeColorClass = 'text-slate-700 dark:text-slate-200';

        function initCategories() {
            const container = document.getElementById('category-tabs-container');
            const categories = ['All', 'Web & Navigation', 'Actions & Editing', 'Media & Audio', 'File & Document', 'E-Commerce & Finances', 'Arrows & Directions', 'Social & Communication'];
            
            container.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.onclick = () => filterCategory(cat);
                btn.id = `cat-${cat.replace(/\s+/g, '-').toLowerCase()}`;
                btn.innerText = cat;
                
                if (cat === activeCategory) {
                    btn.className = "px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold shadow-sm transition-all";
                } else {
                    btn.className = "px-4 py-2 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-750 rounded-xl text-xs font-semibold transition-all";
                }
                container.appendChild(btn);
            });
        }

        function filterCategory(category) {
            activeCategory = category;
            initCategories();
            renderIcons();
            showToast(`Switched category: ${category}`, 'success');
        }

        function handleSearch(val) {
            searchQuery = val.toLowerCase().trim();
            renderIcons();
        }

        function changeStrokeWidth(val) {
            currentStrokeWidth = parseFloat(val);
            document.getElementById('stroke-value').innerText = `${currentStrokeWidth.toFixed(1)}px`;
            
            // Query all svg icons and update live
            const svgs = document.querySelectorAll('.dynamic-preview-icon svg');
            svgs.forEach(svg => {
                svg.setAttribute('stroke-width', currentStrokeWidth);
            });
        }

        function changeIconColor(colorClass) {
            activeColorClass = colorClass;
            renderIcons();
            showToast("Theme color updated", "success");
        }

        function renderIcons() {
            const grid = document.getElementById('icons-display-grid');
            const emptyState = document.getElementById('no-icons-found');
            grid.innerHTML = '';

            let filtered = iconsDatabase.filter(icon => {
                const matchesCategory = activeCategory === 'All' || icon.category === activeCategory;
                const matchesSearch = !searchQuery || icon.name.toLowerCase().includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            grid.classList.remove('hidden');
            emptyState.classList.add('hidden');

            filtered.forEach(icon => {
                const box = document.createElement('button');
                box.onclick = () => openDetailModal(icon.name);
                box.className = "bg-white dark:bg-slate-800 p-4 border border-slate-200/50 dark:border-slate-700/50 rounded-2xl flex flex-col items-center justify-center hover:border-blue-500 dark:hover:border-blue-600 hover:-translate-y-1 hover:shadow-md transition-all duration-300 group";
                
                box.innerHTML = `
                    <div class="w-10 h-10 flex items-center justify-center dynamic-preview-icon ${activeColorClass} group-hover:scale-110 transition-transform">
                        <i data-lucide="${icon.name}"></i>
                    </div>
                    <span class="mt-3 font-mono text-[10px] font-bold text-slate-500 dark:text-slate-400 truncate max-w-full">
                        ${icon.name}
                    </span>
                `;
                grid.appendChild(box);
            });

            // Trigger lucide library update
            lucide.createIcons();

            // Apply stroke values manually to injected svgs
            const svgs = document.querySelectorAll('.dynamic-preview-icon svg');
            svgs.forEach(svg => {
                svg.setAttribute('stroke-width', currentStrokeWidth);
            });
        }

        // =============================================================
        // DETAIL MODAL LOGIC
        // =============================================================
        function openDetailModal(name) {
            const modal = document.getElementById('icon-detail-modal');
            const card = document.getElementById('icon-detail-modal-card');
            
            document.getElementById('modal-icon-name').innerText = name;
            
            // Render Big Icon
            const iconContainer = document.getElementById('modal-big-icon-container');
            iconContainer.innerHTML = `<i data-lucide="${name}" class="w-12 h-12 text-blue-600"></i>`;
            
            // Render codes
            document.getElementById('code-html-tag').innerText = `<i data-lucide="${name}"></i>`;
            
            // Format React Tag name
            const reactName = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
            document.getElementById('code-react-tag').innerText = `<${reactName} size={24} />`;

            // Reset copy button states
            resetCopyButton('btn-copy-html');
            resetCopyButton('btn-copy-react');

            modal.classList.remove('hidden');
            setTimeout(() => {
                card.classList.remove('scale-95', 'opacity-0');
                card.classList.add('scale-100', 'opacity-100');
            }, 50);
            lucide.createIcons();
        }

        function closeDetailModal() {
            const modal = document.getElementById('icon-detail-modal');
            const card = document.getElementById('icon-detail-modal-card');
            card.classList.remove('scale-100', 'opacity-100');
            card.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function copyToClipboard(codeId, buttonId) {
            const codeText = document.getElementById(codeId).innerText;
            navigator.clipboard.writeText(codeText);
            
            const btn = document.getElementById(buttonId);
            btn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-500"></i>`;
            lucide.createIcons();
            
            showToast("Copied to clipboard!", "success");
        }

        function resetCopyButton(id) {
            const btn = document.getElementById(id);
            btn.innerHTML = `<i data-lucide="copy" class="w-3.5 h-3.5"></i>`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const isMinimized = localStorage.getItem('sidebar-minimized') === 'true';
            if (isMinimized) {
                document.body.classList.add('sidebar-minimized');
            }

            const cb = window.location.protocol.startsWith('http') ? '?v=' + new Date().getTime() : '';
            Promise.all([
                fetch('component/sidebar.html' + cb).then(res => res.text()),
                fetch('component/navbar.html' + cb).then(res => res.text()),
                fetch('component/footer.html' + cb).then(res => res.text())
            ])
            .then(([sidebarData, navbarData, footerData]) => {
                document.getElementById('sidebar-placeholder').innerHTML = sidebarData;
                document.getElementById('navbar-placeholder').innerHTML = navbarData;
                document.getElementById('footer-placeholder').innerHTML = footerData;

                if (isMinimized) {
                    const icon = document.getElementById('minimize-icon');
                    if (icon) {
                        icon.setAttribute('data-lucide', 'chevron-right');
                    }
                }

                initAdminControls();
                initPage('icons');
                initProfileDisplay();
                
                // Initialize icon tabs and cards
                initCategories();
                renderIcons();
            })
            .catch(error => {
                console.error('Error loading admin components:', error);
                initProfileDisplay();
            });
        });
    </script>
</body>
</html>
