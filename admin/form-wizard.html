<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Wizard - AIT Themes</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#2563eb', // Blue-600
                        secondary: '#4f46e5', // Indigo-600
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS for Scrollbars & Animations -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .sidebar-item-active {
            background-color: #eff6ff;
            color: #2563eb;
            font-weight: 600;
            border-left: 4px solid #2563eb;
        }
        .dark .sidebar-item-active {
            background-color: rgba(37, 99, 235, 0.15);
            color: #60a5fa;
            border-left: 4px solid #3b82f6;
        }

        /* Sidebar Minimized state */
        @media (min-width: 1024px) {
            body.sidebar-minimized #desktop-sidebar {
                width: 5rem; /* w-20 */
            }
            body.sidebar-minimized #main-content-wrapper {
                padding-left: 5rem; /* lg:pl-20 */
            }
            body.sidebar-minimized #desktop-sidebar #desktop-logo-text,
            body.sidebar-minimized #desktop-sidebar nav span,
            body.sidebar-minimized #desktop-sidebar .tab-btn-text,
            body.sidebar-minimized #desktop-sidebar #desktop-user-info,
            body.sidebar-minimized #desktop-sidebar #desktop-logout-text {
                display: none;
            }
            body.sidebar-minimized #desktop-sidebar .tab-btn {
                justify-content: center;
                padding-left: 0;
                padding-right: 0;
                gap: 0;
            }
            body.sidebar-minimized #desktop-sidebar #desktop-user-card {
                justify-content: center;
                padding: 0.5rem;
            }
            body.sidebar-minimized #desktop-sidebar #desktop-logout-btn {
                justify-content: center;
                padding: 0.5rem;
                width: 2.75rem;
                height: 2.75rem;
                border-radius: 9999px;
            }
            body.sidebar-minimized #desktop-sidebar .h-16 {
                justify-content: center;
                padding-left: 0;
                padding-right: 0;
            }
            body.sidebar-minimized #desktop-sidebar #minimize-sidebar-btn {
                position: absolute;
                right: -0.75rem;
                top: 1.25rem;
                background-color: white;
                border: 1px solid rgb(226, 232, 240);
                box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
                z-index: 50;
                border-radius: 9999px;
            }
            body.sidebar-minimized.dark #desktop-sidebar #minimize-sidebar-btn {
                background-color: rgb(30, 41, 59);
                border-color: rgb(51, 65, 85);
                box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.5);
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-50 font-sans antialiased transition-colors duration-300">

    <!-- Sidebar Placeholder -->
    <div id="sidebar-placeholder"></div>

    <!-- Main Content Wrapper -->
    <div id="main-content-wrapper" class="lg:pl-64 flex flex-col min-h-screen bg-slate-50 dark:bg-slate-900 transition-all duration-300">
        
        <!-- Top Navbar Header Placeholder -->
        <div id="navbar-placeholder"></div>

        <!-- Main Content Area -->
        <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto space-y-6">

            <!-- ================= TAB 6B: FORM WIZARD (UTILITIES) ================= -->
            <section id="tab-form-wizard" class="tab-pane fade-in space-y-6">
                <div class="max-w-3xl mx-auto bg-white dark:bg-slate-800 p-8 rounded-[2rem] border border-slate-200/50 dark:border-slate-700/50 shadow-sm space-y-8">
                    <!-- Header -->
                    <div class="text-center space-y-2">
                        <h4 class="font-bold text-2xl text-slate-800 dark:text-white">Form Wizard Stepper</h4>
                        <p class="text-xs text-slate-500 dark:text-slate-400">Fill in the fields step-by-step to complete the process.</p>
                    </div>

                    <!-- Wizard Stepper Indicators -->
                    <div class="relative flex items-center justify-between w-full max-w-lg mx-auto pb-4">
                        <!-- Progress Line -->
                        <div class="absolute left-0 right-0 top-1/2 -translate-y-1/2 h-1 bg-slate-100 dark:bg-slate-700 z-0"></div>
                        <div id="wizard-progress-bar" class="absolute left-0 top-1/2 -translate-y-1/2 h-1 bg-blue-600 z-0 transition-all duration-300 w-0"></div>

                        <!-- Step 1 Circle -->
                        <div class="relative z-10 flex flex-col items-center gap-2">
                            <div id="wizard-step-indicator-1" class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm border-4 border-white dark:border-slate-800 transition-all duration-300">
                                1
                            </div>
                            <span class="text-xs font-semibold text-slate-700 dark:text-slate-300">Account</span>
                        </div>

                        <!-- Step 2 Circle -->
                        <div class="relative z-10 flex flex-col items-center gap-2">
                            <div id="wizard-step-indicator-2" class="w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-500 dark:text-slate-400 flex items-center justify-center font-bold text-sm border-4 border-white dark:border-slate-800 transition-all duration-300">
                                2
                            </div>
                            <span class="text-xs font-semibold text-slate-400 dark:text-slate-500">Profile</span>
                        </div>

                        <!-- Step 3 Circle -->
                        <div class="relative z-10 flex flex-col items-center gap-2">
                            <div id="wizard-step-indicator-3" class="w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-500 dark:text-slate-400 flex items-center justify-center font-bold text-sm border-4 border-white dark:border-slate-800 transition-all duration-300">
                                3
                            </div>
                            <span class="text-xs font-semibold text-slate-400 dark:text-slate-500">Finish</span>
                        </div>
                    </div>

                    <!-- Step Forms -->
                    <div class="pt-4">
                        <!-- STEP 1 Form -->
                        <div id="wizard-step-content-1" class="space-y-6 transition-all duration-300">
                            <div class="grid sm:grid-cols-2 gap-5">
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Username</label>
                                    <input type="text" id="wizard-username" placeholder="e.g. johndoe" class="block w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Email Address</label>
                                    <input type="email" id="wizard-email" placeholder="john@example.com" class="block w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                                </div>
                            </div>
                            <div class="grid sm:grid-cols-2 gap-5">
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Password</label>
                                    <input type="password" id="wizard-password" placeholder="••••••••" class="block w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Confirm Password</label>
                                    <input type="password" id="wizard-confirm-password" placeholder="••••••••" class="block w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                                </div>
                            </div>
                            <div class="flex justify-end pt-4 border-t border-slate-100 dark:border-slate-700">
                                <button onclick="nextWizardStep(2)" class="px-6 py-3 bg-blue-600 text-white rounded-xl text-xs font-semibold hover:bg-blue-700 hover:shadow-lg transition-all flex items-center gap-1">
                                    Next Step <i data-lucide="chevron-right" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>

                        <!-- STEP 2 Form -->
                        <div id="wizard-step-content-2" class="space-y-6 hidden transition-all duration-300">
                            <div class="grid sm:grid-cols-2 gap-5">
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">First Name</label>
                                    <input type="text" id="wizard-firstname" placeholder="John" class="block w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Last Name</label>
                                    <input type="text" id="wizard-lastname" placeholder="Doe" class="block w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                                </div>
                            </div>
                            <div class="grid sm:grid-cols-2 gap-5">
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Phone Number</label>
                                    <input type="tel" id="wizard-phone" placeholder="e.g. +62812345678" class="block w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Country</label>
                                    <select id="wizard-country" class="block w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                                        <option value="ID">Indonesia</option>
                                        <option value="SG">Singapore</option>
                                        <option value="US">United States</option>
                                        <option value="UK">United Kingdom</option>
                                    </select>
                                </div>
                            </div>
                            <div class="flex justify-between pt-4 border-t border-slate-100 dark:border-slate-700">
                                <button onclick="prevWizardStep(1)" class="px-5 py-3 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 rounded-xl text-xs font-semibold hover:bg-slate-50 dark:hover:bg-slate-900 transition-all flex items-center gap-1">
                                    <i data-lucide="chevron-left" class="w-4 h-4"></i> Back
                                </button>
                                <button onclick="nextWizardStep(3)" class="px-6 py-3 bg-blue-600 text-white rounded-xl text-xs font-semibold hover:bg-blue-700 hover:shadow-lg transition-all flex items-center gap-1">
                                    Next Step <i data-lucide="chevron-right" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>

                        <!-- STEP 3 Form -->
                        <div id="wizard-step-content-3" class="space-y-6 hidden transition-all duration-300">
                            <div class="bg-slate-50 dark:bg-slate-900 p-6 rounded-2xl border border-slate-100 dark:border-slate-700/50 space-y-4">
                                <h5 class="font-bold text-slate-800 dark:text-white border-b border-slate-200 dark:border-slate-700 pb-2">Review Account Details</h5>
                                <div class="grid sm:grid-cols-2 gap-4 text-xs">
                                    <div>
                                        <span class="text-slate-400">Username:</span>
                                        <p id="review-username" class="font-semibold mt-1 text-slate-800 dark:text-white">-</p>
                                    </div>
                                    <div>
                                        <span class="text-slate-400">Email:</span>
                                        <p id="review-email" class="font-semibold mt-1 text-slate-800 dark:text-white">-</p>
                                    </div>
                                    <div>
                                        <span class="text-slate-400">Full Name:</span>
                                        <p id="review-fullname" class="font-semibold mt-1 text-slate-800 dark:text-white">-</p>
                                    </div>
                                    <div>
                                        <span class="text-slate-400">Phone (Country):</span>
                                        <p id="review-phone" class="font-semibold mt-1 text-slate-800 dark:text-white">-</p>
                                    </div>
                                </div>
                            </div>

                            <div class="flex items-center gap-2.5">
                                <input type="checkbox" id="wizard-agree" class="h-4.5 w-4.5 text-blue-600 border-slate-300 rounded cursor-pointer">
                                <label for="wizard-agree" class="text-xs text-slate-500 dark:text-slate-400 cursor-pointer">I declare that all the registered details above are true and complete.</label>
                            </div>

                            <div class="flex justify-between pt-4 border-t border-slate-100 dark:border-slate-700">
                                <button onclick="prevWizardStep(2)" class="px-5 py-3 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 rounded-xl text-xs font-semibold hover:bg-slate-50 dark:hover:bg-slate-900 transition-all flex items-center gap-1">
                                    <i data-lucide="chevron-left" class="w-4 h-4"></i> Back
                                </button>
                                <button onclick="submitWizard()" class="px-6 py-3 bg-emerald-600 text-white rounded-xl text-xs font-semibold hover:bg-emerald-700 hover:shadow-lg transition-all flex items-center gap-1 shadow-md shadow-emerald-500/20">
                                    Finish & Register <i data-lucide="check" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Footer Placeholder -->
            <div id="footer-placeholder"></div>
        </main>
    </div>

    <!-- ================= SYSTEM TOAST NOTIFICATION ================= -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-[60] flex flex-col gap-3 pointer-events-none"></div>

    <script>
        function closeSidebar() {
            const mobileSidebar = document.getElementById('mobile-sidebar');
            const backdrop = document.getElementById('mobile-sidebar-backdrop');
            if (mobileSidebar && backdrop) {
                mobileSidebar.classList.add('-translate-x-full');
                backdrop.classList.remove('opacity-100');
                setTimeout(() => { backdrop.classList.add('hidden'); }, 300);
            }
        }

        function toggleSidebarMinimize() {
            const body = document.body;
            body.classList.toggle('sidebar-minimized');
            
            const isMinimized = body.classList.contains('sidebar-minimized');
            localStorage.setItem('sidebar-minimized', isMinimized ? 'true' : 'false');
            
            const icon = document.getElementById('minimize-icon');
            if (icon) {
                icon.setAttribute('data-lucide', isMinimized ? 'chevron-right' : 'chevron-left');
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }
        }

        function initAdminControls() {
            lucide.createIcons();
            const openMobileBtn = document.getElementById('open-mobile-sidebar-btn');
            const closeMobileBtn = document.getElementById('close-mobile-sidebar-btn');
            const mobileSidebar = document.getElementById('mobile-sidebar');
            const backdrop = document.getElementById('mobile-sidebar-backdrop');

            if (openMobileBtn) openMobileBtn.addEventListener('click', () => {
                mobileSidebar.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
                setTimeout(() => { backdrop.classList.add('opacity-100'); }, 10);
            });
            if (closeMobileBtn) closeMobileBtn.addEventListener('click', closeSidebar);
            if (backdrop) backdrop.addEventListener('click', closeSidebar);

            // Dark Mode Logic
            const htmlElement = document.documentElement;
            const themeBtn = document.getElementById('theme-toggle');
            
            if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                htmlElement.classList.add('dark');
                updateThemeIcons('dark');
            } else {
                htmlElement.classList.remove('dark');
                updateThemeIcons('light');
            }

            function updateThemeIcons(theme) {
                const iconDark = document.getElementById('theme-icon-dark');
                const iconLight = document.getElementById('theme-icon-light');
                if (theme === 'dark') {
                    if (iconDark) iconDark.classList.remove('hidden');
                    if (iconLight) iconLight.classList.add('hidden');
                } else {
                    if (iconDark) iconDark.classList.add('hidden');
                    if (iconLight) iconLight.classList.remove('hidden');
                }
            }

            if (themeBtn) {
                themeBtn.addEventListener('click', () => {
                    let activeTheme = 'light';
                    if (htmlElement.classList.contains('dark')) {
                        htmlElement.classList.remove('dark');
                        localStorage.setItem('color-theme', 'light');
                    } else {
                        htmlElement.classList.add('dark');
                        localStorage.setItem('color-theme', 'dark');
                        activeTheme = 'dark';
                    }
                    updateThemeIcons(activeTheme);
                });
            }
        }

        function initPage(tabId) {
            const titleMap = {
                'overview': 'Analytics Overview',
                'themes': 'Digital Themes Management',
                'users': 'User Management',
                'transactions': 'Transaction History Log',
                'settings': 'Dashboard Settings',
                'form': 'Form Elements Preview',
                'form-wizard': 'Form Wizard Stepper',
                'select': 'Select Elements Preview',
                'datepicker': 'Date & Time Pickers',
                'modal': 'Interactive Modals Preview',
                'alert': 'Alert Panels & Badges'
            };
            
            const pageTitle = document.getElementById('page-title');
            if (pageTitle) {
                pageTitle.innerText = titleMap[tabId] || 'Dashboard';
            }

            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach(btn => {
                if (btn.getAttribute('data-tab') === tabId) {
                    btn.classList.add('sidebar-item-active');
                } else {
                    btn.classList.remove('sidebar-item-active');
                }
            });
        }

        // DATABASE SIMULATION
        const initialUsers = [
            { name: 'Hasrul', email: 'hasrul@aitthemes.com', role: 'Admin', status: 'Active', date: '2026-01-10', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=64&q=80' }
        ];

        function getDB(key, defaults) {
            if (!localStorage.getItem(key)) {
                localStorage.setItem(key, JSON.stringify(defaults));
            }
            return JSON.parse(localStorage.getItem(key));
        }

        let users = getDB('ait_users', initialUsers);

        function initProfileDisplay() {
            const adminUser = users.find(u => u.role === 'Admin') || users[0];
            const userName = adminUser.name;
            const userAvatar = adminUser.avatar;

            document.getElementById('mobile-user-name').innerText = userName;
            document.getElementById('desktop-user-name').innerText = userName;
            document.getElementById('header-user-name').innerText = userName;
            
            document.getElementById('mobile-user-avatar').src = userAvatar;
            document.getElementById('desktop-user-avatar').src = userAvatar;
            document.getElementById('header-user-avatar').src = userAvatar;
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-2xl shadow-xl flex items-center gap-3 bg-white dark:bg-slate-800 border border-slate-200/50 dark:border-slate-700/50 text-slate-800 dark:text-white text-sm pointer-events-auto fade-in transition-all duration-300`;
            
            let iconMarkup = '';
            if (type === 'success') {
                iconMarkup = `<div class="w-8 h-8 rounded-xl bg-emerald-100 dark:bg-emerald-950 flex items-center justify-center text-emerald-600 dark:text-emerald-400 shrink-0"><i data-lucide="check-circle" class="w-5 h-5"></i></div>`;
            } else if (type === 'warning') {
                iconMarkup = `<div class="w-8 h-8 rounded-xl bg-amber-100 dark:bg-amber-950 flex items-center justify-center text-amber-600 dark:text-amber-400 shrink-0"><i data-lucide="alert-triangle" class="w-5 h-5"></i></div>`;
            } else {
                iconMarkup = `<div class="w-8 h-8 rounded-xl bg-rose-100 dark:bg-rose-950 flex items-center justify-center text-rose-600 dark:text-rose-400 shrink-0"><i data-lucide="alert-circle" class="w-5 h-5"></i></div>`;
            }

            toast.innerHTML = `
                ${iconMarkup}
                <div class="flex-1 font-medium">${message}</div>
                <button class="text-slate-400 hover:text-slate-600 dark:hover:text-white" onclick="this.parentElement.remove()">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            `;

            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => { toast.remove(); }, 300);
            }, 4000);
        }

        // Form Wizard Stepper Logics
        function prevWizardStep(stepNum) {
            document.getElementById('wizard-step-content-1').classList.add('hidden');
            document.getElementById('wizard-step-content-2').classList.add('hidden');
            document.getElementById('wizard-step-content-3').classList.add('hidden');
            document.getElementById(`wizard-step-content-${stepNum}`).classList.remove('hidden');
            updateWizardStepperIndicators(stepNum);
        }

        function nextWizardStep(stepNum) {
            if (stepNum === 2) {
                const u = document.getElementById('wizard-username').value;
                const e = document.getElementById('wizard-email').value;
                if (!u || !e) {
                    showToast('Please fill in Username and Email!', 'error');
                    return;
                }
            } else if (stepNum === 3) {
                const fn = document.getElementById('wizard-firstname').value;
                const ln = document.getElementById('wizard-lastname').value;
                if (!fn || !ln) {
                    showToast('Please fill in your First and Last Name!', 'error');
                    return;
                }
                document.getElementById('review-username').innerText = document.getElementById('wizard-username').value;
                document.getElementById('review-email').innerText = document.getElementById('wizard-email').value;
                document.getElementById('review-fullname').innerText = `${fn} ${ln}`;
                document.getElementById('review-phone').innerText = `${document.getElementById('wizard-phone').value || '-'} (${document.getElementById('wizard-country').value})`;
            }

            document.getElementById('wizard-step-content-1').classList.add('hidden');
            document.getElementById('wizard-step-content-2').classList.add('hidden');
            document.getElementById('wizard-step-content-3').classList.add('hidden');
            document.getElementById(`wizard-step-content-${stepNum}`).classList.remove('hidden');
            updateWizardStepperIndicators(stepNum);
        }

        function updateWizardStepperIndicators(activeStep) {
            const step1 = document.getElementById('wizard-step-indicator-1');
            const step2 = document.getElementById('wizard-step-indicator-2');
            const step3 = document.getElementById('wizard-step-indicator-3');
            const bar = document.getElementById('wizard-progress-bar');

            [step1, step2, step3].forEach((step, idx) => {
                step.className = "w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm border-4 border-white dark:border-slate-800 transition-all duration-300 ";
                const stepNum = idx + 1;
                if (stepNum < activeStep) {
                    step.className += "bg-emerald-500 text-white";
                    step.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i>`;
                } else if (stepNum === activeStep) {
                    step.className += "bg-blue-600 text-white";
                    step.innerHTML = stepNum;
                } else {
                    step.className += "bg-slate-200 dark:bg-slate-700 text-slate-500 dark:text-slate-400";
                    step.innerHTML = stepNum;
                }
            });

            if (activeStep === 1) bar.style.width = "0%";
            if (activeStep === 2) bar.style.width = "50%";
            if (activeStep === 3) bar.style.width = "100%";

            if (window.lucide) {
                window.lucide.createIcons();
            }
        }

        function submitWizard() {
            const agree = document.getElementById('wizard-agree').checked;
            if (!agree) {
                showToast('You must agree to the terms to finish!', 'error');
                return;
            }
            showToast('Account successfully registered via Wizard!', 'success');
            
            document.getElementById('wizard-username').value = '';
            document.getElementById('wizard-email').value = '';
            document.getElementById('wizard-password').value = '';
            document.getElementById('wizard-confirm-password').value = '';
            document.getElementById('wizard-firstname').value = '';
            document.getElementById('wizard-lastname').value = '';
            document.getElementById('wizard-phone').value = '';
            document.getElementById('wizard-agree').checked = false;
            prevWizardStep(1);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const isMinimized = localStorage.getItem('sidebar-minimized') === 'true';
            if (isMinimized) {
                document.body.classList.add('sidebar-minimized');
            }

            const cb = window.location.protocol.startsWith('http') ? '?v=' + new Date().getTime() : '';
            Promise.all([
                fetch('component/sidebar.html' + cb).then(res => res.text()),
                fetch('component/navbar.html' + cb).then(res => res.text()),
                fetch('component/footer.html' + cb).then(res => res.text())
            ])
            .then(([sidebarData, navbarData, footerData]) => {
                document.getElementById('sidebar-placeholder').innerHTML = sidebarData;
                document.getElementById('navbar-placeholder').innerHTML = navbarData;
                document.getElementById('footer-placeholder').innerHTML = footerData;

                if (isMinimized) {
                    const icon = document.getElementById('minimize-icon');
                    if (icon) {
                        icon.setAttribute('data-lucide', 'chevron-right');
                    }
                }

                initAdminControls();
                initPage('form-wizard');
                initProfileDisplay();
            })
            .catch(error => {
                console.error('Error loading admin components:', error);
                initProfileDisplay();
            });
        });
    </script>
</body>
</html>
