<!-- Top Navbar Header -->
<header class="sticky top-0 z-20 flex h-16 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200/50 dark:border-slate-700/50 px-4 sm:px-6 lg:px-8 items-center justify-between transition-colors duration-300">
    <!-- Left Side: Mobile Menu Button & Page Title -->
    <div class="flex items-center gap-4">
        <button id="open-mobile-sidebar-btn" class="p-1 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 lg:hidden">
            <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
        <div class="hidden sm:block">
            <h1 id="page-title" class="text-lg font-bold text-slate-800 dark:text-white">Analytics Overview</h1>
        </div>
    </div>

    <!-- Right Side: Dark mode, notification, profile -->
    <div class="flex items-center gap-3">
        <!-- Theme Toggle Button -->
        <button id="theme-toggle" class="p-2.5 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition-all">
            <i data-lucide="moon" id="theme-icon-dark" class="w-5 h-5 hidden"></i>
            <i data-lucide="sun" id="theme-icon-light" class="w-5 h-5"></i>
        </button>

        <!-- Notifications Dropdown -->
        <div class="relative">
            <button id="notification-btn" class="p-2.5 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition-all relative">
                <i data-lucide="bell" class="w-5 h-5"></i>
                <span class="absolute top-2 right-2.5 w-2 h-2 bg-rose-500 rounded-full"></span>
            </button>
            <!-- Notification Panel (Simulated dropdown) -->
            <div id="notification-dropdown" class="absolute right-0 mt-2 w-80 bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200/50 dark:border-slate-700/50 hidden z-50">
                <div class="px-4 py-3 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center">
                    <h4 class="font-bold text-sm">Notifications</h4>
                    <span class="text-xs text-blue-600 dark:text-blue-400 cursor-pointer hover:underline">Mark as read</span>
                </div>
                <div class="py-2 max-h-64 overflow-y-auto">
                    <div class="px-4 py-2.5 hover:bg-slate-50 dark:hover:bg-slate-700/50 flex gap-3 cursor-pointer">
                        <div class="w-8 h-8 rounded-full bg-emerald-100 dark:bg-emerald-950 flex items-center justify-center text-emerald-600 dark:text-emerald-400 shrink-0">
                            <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                        </div>
                        <div>
                            <p class="text-xs font-semibold">New Sale!</p>
                            <p class="text-[11px] text-slate-500">Apex E-Commerce theme purchased by Diana.</p>
                            <span class="text-[10px] text-slate-400">2 minutes ago</span>
                        </div>
                    </div>
                    <div class="px-4 py-2.5 hover:bg-slate-50 dark:hover:bg-slate-700/50 flex gap-3 cursor-pointer">
                        <div class="w-8 h-8 rounded-full bg-blue-100 dark:bg-blue-950 flex items-center justify-center text-blue-600 dark:text-blue-400 shrink-0">
                            <i data-lucide="user-plus" class="w-4 h-4"></i>
                        </div>
                        <div>
                            <p class="text-xs font-semibold">User Registered</p>
                            <p class="text-[11px] text-slate-500">Budi Sutrisno registered a new account.</p>
                            <span class="text-[10px] text-slate-400">1 hour ago</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="h-8 w-[1px] bg-slate-200 dark:bg-slate-700"></div>

        <!-- Admin Profile Info -->
        <div class="flex items-center gap-2 pl-1">
            <img id="header-user-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=64&q=80" alt="Avatar" class="w-9 h-9 rounded-xl object-cover border border-slate-200 dark:border-slate-700">
            <span id="header-user-name" class="hidden md:inline text-sm font-semibold text-slate-700 dark:text-slate-300">Hasrul</span>
        </div>
    </div>
</header>
