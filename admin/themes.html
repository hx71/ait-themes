<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Themes Management - AIT Themes</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#2563eb', // Blue-600
                        secondary: '#4f46e5', // Indigo-600
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS for Scrollbars & Animations -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .sidebar-item-active {
            background-color: #eff6ff;
            color: #2563eb;
            font-weight: 600;
            border-left: 4px solid #2563eb;
        }
        .dark .sidebar-item-active {
            background-color: rgba(37, 99, 235, 0.15);
            color: #60a5fa;
            border-left: 4px solid #3b82f6;
        }

        /* Sidebar Minimized state */
        @media (min-width: 1024px) {
            body.sidebar-minimized #desktop-sidebar {
                width: 5rem; /* w-20 */
            }
            body.sidebar-minimized #main-content-wrapper {
                padding-left: 5rem; /* lg:pl-20 */
            }
            body.sidebar-minimized #desktop-sidebar #desktop-logo-text,
            body.sidebar-minimized #desktop-sidebar nav span,
            body.sidebar-minimized #desktop-sidebar .tab-btn-text,
            body.sidebar-minimized #desktop-sidebar #desktop-user-info,
            body.sidebar-minimized #desktop-sidebar #desktop-logout-text {
                display: none;
            }
            body.sidebar-minimized #desktop-sidebar .tab-btn {
                justify-content: center;
                padding-left: 0;
                padding-right: 0;
                gap: 0;
            }
            body.sidebar-minimized #desktop-sidebar #desktop-user-card {
                justify-content: center;
                padding: 0.5rem;
            }
            body.sidebar-minimized #desktop-sidebar #desktop-logout-btn {
                justify-content: center;
                padding: 0.5rem;
                width: 2.75rem;
                height: 2.75rem;
                border-radius: 9999px;
            }
            body.sidebar-minimized #desktop-sidebar .h-16 {
                justify-content: center;
                padding-left: 0;
                padding-right: 0;
            }
            body.sidebar-minimized #desktop-sidebar #minimize-sidebar-btn {
                position: absolute;
                right: -0.75rem;
                top: 1.25rem;
                background-color: white;
                border: 1px solid rgb(226, 232, 240);
                box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
                z-index: 50;
                border-radius: 9999px;
            }
            body.sidebar-minimized.dark #desktop-sidebar #minimize-sidebar-btn {
                background-color: rgb(30, 41, 59);
                border-color: rgb(51, 65, 85);
                box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.5);
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-50 font-sans antialiased transition-colors duration-300">

    <!-- Sidebar Placeholder -->
    <div id="sidebar-placeholder"></div>

    <!-- Main Content Wrapper -->
    <div id="main-content-wrapper" class="lg:pl-64 flex flex-col min-h-screen bg-slate-50 dark:bg-slate-900 transition-all duration-300">
        
        <!-- Top Navbar Header Placeholder -->
        <div id="navbar-placeholder"></div>

        <!-- Main Content Area -->
        <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto space-y-6">

            <!-- ================= TAB 2: THEMES ================= -->
            <section id="tab-themes" class="tab-pane fade-in space-y-6">
                <!-- Theme Header Controls -->
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200/50 dark:border-slate-700/50 shadow-sm">
                    <div class="relative w-full sm:w-80">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="search" class="w-4 h-4 text-slate-400"></i>
                        </div>
                        <input id="theme-search" type="text" oninput="renderThemes()" class="block w-full pl-9 pr-4 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="Search theme name...">
                    </div>
                    <button onclick="openAddThemeModal()" class="w-full sm:w-auto px-5 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl text-sm font-semibold hover:shadow-lg hover:shadow-blue-500/20 hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i> Add New Theme
                    </button>
                </div>

                <!-- Theme Digital Cards Grid -->
                <div id="themes-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Load dynamically via JS -->
                </div>
            </section>

            <!-- Footer Placeholder -->
            <div id="footer-placeholder"></div>
        </main>
    </div>

    <!-- ================= MODAL: ADD / EDIT THEME ================= -->
    <div id="theme-modal" class="fixed inset-0 z-50 overflow-y-auto hidden">
        <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 transition-opacity bg-slate-900/50 backdrop-blur-sm" onclick="closeThemeModal()"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
            
            <div class="inline-block align-bottom bg-white dark:bg-slate-800 rounded-[2rem] text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full border border-slate-200/50 dark:border-slate-700/50 scale-95 opacity-0 duration-300" id="theme-modal-card">
                <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50/50 dark:bg-slate-900/10">
                    <h3 id="theme-modal-title" class="text-lg font-bold text-slate-900 dark:text-white">Add New Theme</h3>
                    <button onclick="closeThemeModal()" class="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 rounded-lg">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                <form id="theme-form" onsubmit="saveThemeForm(event)">
                    <input type="hidden" id="theme-form-id">
                    <div class="p-6 space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Digital Theme Name</label>
                            <input type="text" id="theme-form-title" required class="block w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="e.g. SaaS Builder Pro">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Category</label>
                                <select id="theme-form-category" class="block w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white outline-none">
                                    <option value="SaaS">SaaS</option>
                                    <option value="E-Commerce">E-Commerce</option>
                                    <option value="Portfolio">Portfolio</option>
                                    <option value="Agency">Agency</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Price (IDR)</label>
                                <input type="number" id="theme-form-price" required class="block w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="249000">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Screenshot Image URL</label>
                            <input type="text" id="theme-form-image" class="block w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" value="https://images.unsplash.com/photo-1460925895917-afdab827c52f?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Initial Downloads</label>
                                <input type="number" id="theme-form-downloads" class="block w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white outline-none" value="0">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Initial Rating (0 - 5)</label>
                                <input type="number" step="0.1" max="5" min="0" id="theme-form-rating" class="block w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white outline-none" value="5.0">
                            </div>
                        </div>
                    </div>
                    <div class="px-6 py-4 border-t border-slate-100 dark:border-slate-700 flex justify-end gap-3 bg-slate-50/50 dark:bg-slate-900/10">
                        <button type="button" onclick="closeThemeModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-xl text-sm font-medium transition-colors">
                            Cancel
                        </button>
                        <button type="submit" class="px-5 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl text-sm font-semibold hover:shadow-lg transition-all">
                            Save Theme
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ================= SYSTEM TOAST NOTIFICATION ================= -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-[60] flex flex-col gap-3 pointer-events-none"></div>

    <script>
        function closeSidebar() {
            const mobileSidebar = document.getElementById('mobile-sidebar');
            const backdrop = document.getElementById('mobile-sidebar-backdrop');
            if (mobileSidebar && backdrop) {
                mobileSidebar.classList.add('-translate-x-full');
                backdrop.classList.remove('opacity-100');
                setTimeout(() => { backdrop.classList.add('hidden'); }, 300);
            }
        }

        function toggleSidebarMinimize() {
            const body = document.body;
            body.classList.toggle('sidebar-minimized');
            
            const isMinimized = body.classList.contains('sidebar-minimized');
            localStorage.setItem('sidebar-minimized', isMinimized ? 'true' : 'false');
            
            const icon = document.getElementById('minimize-icon');
            if (icon) {
                icon.setAttribute('data-lucide', isMinimized ? 'chevron-right' : 'chevron-left');
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }
        }

        function initAdminControls() {
            lucide.createIcons();
            const openMobileBtn = document.getElementById('open-mobile-sidebar-btn');
            const closeMobileBtn = document.getElementById('close-mobile-sidebar-btn');
            const mobileSidebar = document.getElementById('mobile-sidebar');
            const backdrop = document.getElementById('mobile-sidebar-backdrop');

            if (openMobileBtn) openMobileBtn.addEventListener('click', () => {
                mobileSidebar.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
                setTimeout(() => { backdrop.classList.add('opacity-100'); }, 10);
            });
            if (closeMobileBtn) closeMobileBtn.addEventListener('click', closeSidebar);
            if (backdrop) backdrop.addEventListener('click', closeSidebar);

            // Dark Mode Logic
            const htmlElement = document.documentElement;
            const themeBtn = document.getElementById('theme-toggle');
            
            if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                htmlElement.classList.add('dark');
                updateThemeIcons('dark');
            } else {
                htmlElement.classList.remove('dark');
                updateThemeIcons('light');
            }

            function updateThemeIcons(theme) {
                const iconDark = document.getElementById('theme-icon-dark');
                const iconLight = document.getElementById('theme-icon-light');
                if (theme === 'dark') {
                    if (iconDark) iconDark.classList.remove('hidden');
                    if (iconLight) iconLight.classList.add('hidden');
                } else {
                    if (iconDark) iconDark.classList.add('hidden');
                    if (iconLight) iconLight.classList.remove('hidden');
                }
            }

            if (themeBtn) {
                themeBtn.addEventListener('click', () => {
                    let activeTheme = 'light';
                    if (htmlElement.classList.contains('dark')) {
                        htmlElement.classList.remove('dark');
                        localStorage.setItem('color-theme', 'light');
                    } else {
                        htmlElement.classList.add('dark');
                        localStorage.setItem('color-theme', 'dark');
                        activeTheme = 'dark';
                    }
                    updateThemeIcons(activeTheme);
                });
            }
        }

        function initPage(tabId) {
            const titleMap = {
                'overview': 'Analytics Overview',
                'themes': 'Digital Themes Management',
                'users': 'User Management',
                'transactions': 'Transaction History Log',
                'settings': 'Dashboard Settings',
                'form': 'Form Elements Preview',
                'form-wizard': 'Form Wizard Stepper',
                'select': 'Select Elements Preview',
                'datepicker': 'Date & Time Pickers',
                'modal': 'Interactive Modals Preview',
                'alert': 'Alert Panels & Badges'
            };
            
            const pageTitle = document.getElementById('page-title');
            if (pageTitle) {
                pageTitle.innerText = titleMap[tabId] || 'Dashboard';
            }

            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach(btn => {
                if (btn.getAttribute('data-tab') === tabId) {
                    btn.classList.add('sidebar-item-active');
                } else {
                    btn.classList.remove('sidebar-item-active');
                }
            });
        }

        // DATABASE SIMULATION
        const initialThemes = [
            { id: 1, title: 'Startup-Pro Landing Page', category: 'SaaS', price: 249000, image: 'https://images.unsplash.com/photo-1460925895917-afdab827c52f?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80', downloads: 420, rating: 4.8 },
            { id: 2, title: 'Apex Modern E-Commerce', category: 'E-Commerce', price: 349000, image: 'https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80', downloads: 312, rating: 4.9 },
            { id: 3, title: 'Minimalist Portfolio Clean', category: 'Portfolio', price: 149000, image: 'https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80', downloads: 189, rating: 4.7 },
            { id: 4, title: 'BizGrow Corporate Agency', category: 'Agency', price: 299000, image: 'https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80', downloads: 255, rating: 4.6 }
        ];

        const initialUsers = [
            { name: 'Hasrul', email: 'hasrul@aitthemes.com', role: 'Admin', status: 'Active', date: '2026-01-10', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=64&q=80' }
        ];

        function getDB(key, defaults) {
            if (!localStorage.getItem(key)) {
                localStorage.setItem(key, JSON.stringify(defaults));
            }
            return JSON.parse(localStorage.getItem(key));
        }

        function saveDB(key, data) {
            localStorage.setItem(key, JSON.stringify(data));
        }

        let themes = getDB('ait_themes', initialThemes);
        let users = getDB('ait_users', initialUsers);

        function initProfileDisplay() {
            const adminUser = users.find(u => u.role === 'Admin') || users[0];
            const userName = adminUser.name;
            const userAvatar = adminUser.avatar;

            document.getElementById('mobile-user-name').innerText = userName;
            document.getElementById('desktop-user-name').innerText = userName;
            document.getElementById('header-user-name').innerText = userName;
            
            document.getElementById('mobile-user-avatar').src = userAvatar;
            document.getElementById('desktop-user-avatar').src = userAvatar;
            document.getElementById('header-user-avatar').src = userAvatar;
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-2xl shadow-xl flex items-center gap-3 bg-white dark:bg-slate-800 border border-slate-200/50 dark:border-slate-700/50 text-slate-800 dark:text-white text-sm pointer-events-auto fade-in transition-all duration-300`;
            
            let iconMarkup = '';
            if (type === 'success') {
                iconMarkup = `<div class="w-8 h-8 rounded-xl bg-emerald-100 dark:bg-emerald-950 flex items-center justify-center text-emerald-600 dark:text-emerald-400 shrink-0"><i data-lucide="check-circle" class="w-5 h-5"></i></div>`;
            } else if (type === 'warning') {
                iconMarkup = `<div class="w-8 h-8 rounded-xl bg-amber-100 dark:bg-amber-950 flex items-center justify-center text-amber-600 dark:text-amber-400 shrink-0"><i data-lucide="alert-triangle" class="w-5 h-5"></i></div>`;
            } else {
                iconMarkup = `<div class="w-8 h-8 rounded-xl bg-rose-100 dark:bg-rose-950 flex items-center justify-center text-rose-600 dark:text-rose-400 shrink-0"><i data-lucide="alert-circle" class="w-5 h-5"></i></div>`;
            }

            toast.innerHTML = `
                ${iconMarkup}
                <div class="flex-1 font-medium">${message}</div>
                <button class="text-slate-400 hover:text-slate-600 dark:hover:text-white" onclick="this.parentElement.remove()">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            `;

            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => { toast.remove(); }, 300);
            }, 4000);
        }

        // THEMES METHODS
        function renderThemes() {
            const grid = document.getElementById('themes-grid');
            const search = document.getElementById('theme-search').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = themes.filter(t => t.title.toLowerCase().includes(search));

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-12 flex flex-col items-center justify-center text-slate-400">
                        <i data-lucide="frown" class="w-12 h-12 mb-3"></i>
                        <p class="font-medium text-sm">Theme not found.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            filtered.forEach(t => {
                grid.innerHTML += `
                    <div class="bg-white dark:bg-slate-800 border border-slate-200/50 dark:border-slate-700/50 rounded-2xl overflow-hidden shadow-sm hover:shadow-md hover:-translate-y-1 transition-all duration-300 flex flex-col justify-between">
                        <div>
                            <div class="h-44 relative bg-slate-100 overflow-hidden">
                                <img src="${t.image}" alt="${t.title}" class="w-full h-full object-cover">
                                <span class="absolute top-3 left-3 px-3 py-1 bg-slate-900/80 backdrop-blur-sm text-white text-[11px] font-bold rounded-full uppercase tracking-wider">
                                    ${t.category}
                                </span>
                            </div>
                            <div class="p-5 space-y-3">
                                <h4 class="font-bold text-slate-800 dark:text-white text-base truncate" title="${t.title}">${t.title}</h4>
                                <div class="flex items-center gap-4 text-xs text-slate-500 dark:text-slate-400">
                                    <span class="flex items-center gap-1"><i data-lucide="download" class="w-3.5 h-3.5 text-blue-500"></i> ${t.downloads} times</span>
                                    <span class="flex items-center gap-1"><i data-lucide="star" class="w-3.5 h-3.5 fill-amber-400 text-amber-400"></i> ${t.rating}</span>
                                </div>
                                <div class="text-lg font-extrabold text-blue-600 dark:text-blue-400">
                                    Rp ${t.price.toLocaleString('id-ID')}
                                </div>
                            </div>
                        </div>
                        <div class="px-5 pb-5 pt-2 flex items-center gap-2">
                            <button onclick="openEditThemeModal(${t.id})" class="flex-1 py-2 px-3 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-750 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition-colors">
                                <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> Edit
                            </button>
                            <button onclick="deleteTheme(${t.id})" class="py-2 px-3 border border-rose-200 dark:border-rose-950/30 text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-900/10 rounded-xl text-xs font-semibold flex items-center justify-center gap-1 transition-colors">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Delete
                            </button>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        const themeModal = document.getElementById('theme-modal');
        const themeModalCard = document.getElementById('theme-modal-card');

        function openAddThemeModal() {
            document.getElementById('theme-modal-title').innerText = 'Add New Theme';
            document.getElementById('theme-form-id').value = '';
            document.getElementById('theme-form-title').value = '';
            document.getElementById('theme-form-category').value = 'SaaS';
            document.getElementById('theme-form-price').value = '';
            document.getElementById('theme-form-image').value = 'https://images.unsplash.com/photo-1460925895917-afdab827c52f?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80';
            document.getElementById('theme-form-downloads').value = '0';
            document.getElementById('theme-form-rating').value = '5.0';

            themeModal.classList.remove('hidden');
            setTimeout(() => {
                themeModalCard.classList.remove('scale-95', 'opacity-0');
            }, 50);
        }

        function openEditThemeModal(id) {
            const t = themes.find(item => item.id === id);
            if (!t) return;

            document.getElementById('theme-modal-title').innerText = 'Edit Digital Theme';
            document.getElementById('theme-form-id').value = t.id;
            document.getElementById('theme-form-title').value = t.title;
            document.getElementById('theme-form-category').value = t.category;
            document.getElementById('theme-form-price').value = t.price;
            document.getElementById('theme-form-image').value = t.image;
            document.getElementById('theme-form-downloads').value = t.downloads;
            document.getElementById('theme-form-rating').value = t.rating;

            themeModal.classList.remove('hidden');
            setTimeout(() => {
                themeModalCard.classList.remove('scale-95', 'opacity-0');
            }, 50);
        }

        function closeThemeModal() {
            themeModalCard.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                themeModal.classList.add('hidden');
            }, 250);
        }

        function saveThemeForm(e) {
            e.preventDefault();
            const id = document.getElementById('theme-form-id').value;
            const title = document.getElementById('theme-form-title').value;
            const category = document.getElementById('theme-form-category').value;
            const price = Number(document.getElementById('theme-form-price').value);
            const image = document.getElementById('theme-form-image').value;
            const downloads = Number(document.getElementById('theme-form-downloads').value);
            const rating = Number(document.getElementById('theme-form-rating').value);

            if (id) {
                themes = themes.map(t => t.id === Number(id) ? { ...t, title, category, price, image, downloads, rating } : t);
                showToast(`Theme "${title}" successfully updated!`, 'success');
            } else {
                const newId = themes.length > 0 ? Math.max(...themes.map(t => t.id)) + 1 : 1;
                themes.push({ id: newId, title, category, price, image, downloads, rating });
                showToast(`New theme "${title}" successfully uploaded!`, 'success');
            }

            saveDB('ait_themes', themes);
            closeThemeModal();
            renderThemes();
        }

        function deleteTheme(id) {
            const t = themes.find(item => item.id === id);
            if (!t) return;

            if (confirm(`Are you sure you want to delete the theme "${t.title}"?`)) {
                themes = themes.filter(item => item.id !== id);
                saveDB('ait_themes', themes);
                showToast(`Theme "${t.title}" has been deleted!`, 'warning');
                renderThemes();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const isMinimized = localStorage.getItem('sidebar-minimized') === 'true';
            if (isMinimized) {
                document.body.classList.add('sidebar-minimized');
            }

            const cb = window.location.protocol.startsWith('http') ? '?v=' + new Date().getTime() : '';
            Promise.all([
                fetch('component/sidebar.html' + cb).then(res => res.text()),
                fetch('component/navbar.html' + cb).then(res => res.text()),
                fetch('component/footer.html' + cb).then(res => res.text())
            ])
            .then(([sidebarData, navbarData, footerData]) => {
                document.getElementById('sidebar-placeholder').innerHTML = sidebarData;
                document.getElementById('navbar-placeholder').innerHTML = navbarData;
                document.getElementById('footer-placeholder').innerHTML = footerData;

                if (isMinimized) {
                    const icon = document.getElementById('minimize-icon');
                    if (icon) {
                        icon.setAttribute('data-lucide', 'chevron-right');
                    }
                }

                initAdminControls();
                initPage('themes');
                initProfileDisplay();
                renderThemes();
            })
            .catch(error => {
                console.error('Error loading admin components:', error);
                initProfileDisplay();
                renderThemes();
            });
        });
    </script>
</body>
</html>
