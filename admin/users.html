<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Management - AIT Themes</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#2563eb', // Blue-600
                        secondary: '#4f46e5', // Indigo-600
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS for Scrollbars & Animations -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .sidebar-item-active {
            background-color: #eff6ff;
            color: #2563eb;
            font-weight: 600;
            border-left: 4px solid #2563eb;
        }
        .dark .sidebar-item-active {
            background-color: rgba(37, 99, 235, 0.15);
            color: #60a5fa;
            border-left: 4px solid #3b82f6;
        }

        /* Sidebar Minimized state */
        @media (min-width: 1024px) {
            body.sidebar-minimized #desktop-sidebar {
                width: 5rem; /* w-20 */
            }
            body.sidebar-minimized #main-content-wrapper {
                padding-left: 5rem; /* lg:pl-20 */
            }
            body.sidebar-minimized #desktop-sidebar #desktop-logo-text,
            body.sidebar-minimized #desktop-sidebar nav span,
            body.sidebar-minimized #desktop-sidebar .tab-btn-text,
            body.sidebar-minimized #desktop-sidebar #desktop-user-info,
            body.sidebar-minimized #desktop-sidebar #desktop-logout-text {
                display: none;
            }
            body.sidebar-minimized #desktop-sidebar .tab-btn {
                justify-content: center;
                padding-left: 0;
                padding-right: 0;
                gap: 0;
            }
            body.sidebar-minimized #desktop-sidebar #desktop-user-card {
                justify-content: center;
                padding: 0.5rem;
            }
            body.sidebar-minimized #desktop-sidebar #desktop-logout-btn {
                justify-content: center;
                padding: 0.5rem;
                width: 2.75rem;
                height: 2.75rem;
                border-radius: 9999px;
            }
            body.sidebar-minimized #desktop-sidebar .h-16 {
                justify-content: center;
                padding-left: 0;
                padding-right: 0;
            }
            body.sidebar-minimized #desktop-sidebar #minimize-sidebar-btn {
                position: absolute;
                right: -0.75rem;
                top: 1.25rem;
                background-color: white;
                border: 1px solid rgb(226, 232, 240);
                box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
                z-index: 50;
                border-radius: 9999px;
            }
            body.sidebar-minimized.dark #desktop-sidebar #minimize-sidebar-btn {
                background-color: rgb(30, 41, 59);
                border-color: rgb(51, 65, 85);
                box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.5);
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-50 font-sans antialiased transition-colors duration-300">

    <!-- Sidebar Placeholder -->
    <div id="sidebar-placeholder"></div>

    <!-- Main Content Wrapper -->
    <div id="main-content-wrapper" class="lg:pl-64 flex flex-col min-h-screen bg-slate-50 dark:bg-slate-900 transition-all duration-300">
        
        <!-- Top Navbar Header Placeholder -->
        <div id="navbar-placeholder"></div>

        <!-- Main Content Area -->
        <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto space-y-6">

            <!-- ================= TAB 3: USERS ================= -->
            <section id="tab-users" class="tab-pane fade-in space-y-6">
                <!-- User Controls -->
                <div class="flex flex-col sm:flex-row justify-between items-center gap-4 bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200/50 dark:border-slate-700/50 shadow-sm">
                    <div class="relative w-full sm:w-80">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="search" class="w-4 h-4 text-slate-400"></i>
                        </div>
                        <input id="user-search" type="text" oninput="renderUsers()" class="block w-full pl-9 pr-4 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="Search name or email...">
                    </div>
                    <div class="w-full sm:w-auto flex items-center gap-2 justify-end">
                        <span class="text-xs text-slate-400 whitespace-nowrap">Filter Role:</span>
                        <select id="user-role-filter" onchange="renderUsers()" class="px-3 py-2 text-sm border border-slate-200 dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-900 text-slate-600 dark:text-slate-300 outline-none">
                            <option value="All">All</option>
                            <option value="Admin">Admin</option>
                            <option value="Editor">Editor</option>
                            <option value="Member">Member</option>
                        </select>
                    </div>
                </div>

                <!-- Users Table -->
                <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/50 dark:border-slate-700/50 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead>
                                <tr class="border-b border-slate-100 dark:border-slate-700 text-slate-400 font-semibold bg-slate-50/50 dark:bg-slate-900/10">
                                    <th class="py-3 px-6">User Name</th>
                                    <th class="py-3 px-6">Role</th>
                                    <th class="py-3 px-6">Status</th>
                                    <th class="py-3 px-6">Date Joined</th>
                                    <th class="py-3 px-6 text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="users-table-tbody">
                                <!-- Dynamic user rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- Footer Placeholder -->
            <div id="footer-placeholder"></div>
        </main>
    </div>

    <!-- ================= MODAL: EDIT USER ================= -->
    <div id="user-modal" class="fixed inset-0 z-50 overflow-y-auto hidden">
        <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 transition-opacity bg-slate-900/50 backdrop-blur-sm" onclick="closeUserModal()"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>

            <div class="inline-block align-bottom bg-white dark:bg-slate-800 rounded-[2rem] text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-md sm:w-full border border-slate-200/50 dark:border-slate-700/50 scale-95 opacity-0 duration-300" id="user-modal-card">
                <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50/50 dark:bg-slate-900/10">
                    <h3 class="text-lg font-bold text-slate-900 dark:text-white">Edit User</h3>
                    <button onclick="closeUserModal()" class="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 rounded-lg">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                <form id="user-form" onsubmit="saveUserForm(event)">
                    <input type="hidden" id="user-form-email">
                    <div class="p-6 space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">User Name</label>
                            <input type="text" id="user-form-name" required class="block w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Email Address (Key)</label>
                            <input type="text" id="user-form-email-display" disabled class="block w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-900/50 text-slate-500 cursor-not-allowed outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Role</label>
                                <select id="user-form-role" class="block w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white outline-none">
                                    <option value="Admin">Admin</option>
                                    <option value="Editor">Editor</option>
                                    <option value="Member">Member</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Account Status</label>
                                <select id="user-form-status" class="block w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white outline-none">
                                    <option value="Active">Active</option>
                                    <option value="Inactive">Inactive</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="px-6 py-4 border-t border-slate-100 dark:border-slate-700 flex justify-end gap-3 bg-slate-50/50 dark:bg-slate-900/10">
                        <button type="button" onclick="closeUserModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-xl text-sm font-medium transition-colors">
                            Cancel
                        </button>
                        <button type="submit" class="px-5 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl text-sm font-semibold hover:shadow-lg transition-all">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ================= SYSTEM TOAST NOTIFICATION ================= -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-[60] flex flex-col gap-3 pointer-events-none"></div>

    <script>
        function closeSidebar() {
            const mobileSidebar = document.getElementById('mobile-sidebar');
            const backdrop = document.getElementById('mobile-sidebar-backdrop');
            if (mobileSidebar && backdrop) {
                mobileSidebar.classList.add('-translate-x-full');
                backdrop.classList.remove('opacity-100');
                setTimeout(() => { backdrop.classList.add('hidden'); }, 300);
            }
        }

        function toggleSidebarMinimize() {
            const body = document.body;
            body.classList.toggle('sidebar-minimized');
            
            const isMinimized = body.classList.contains('sidebar-minimized');
            localStorage.setItem('sidebar-minimized', isMinimized ? 'true' : 'false');
            
            const icon = document.getElementById('minimize-icon');
            if (icon) {
                icon.setAttribute('data-lucide', isMinimized ? 'chevron-right' : 'chevron-left');
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }
        }

        function initAdminControls() {
            lucide.createIcons();
            const openMobileBtn = document.getElementById('open-mobile-sidebar-btn');
            const closeMobileBtn = document.getElementById('close-mobile-sidebar-btn');
            const mobileSidebar = document.getElementById('mobile-sidebar');
            const backdrop = document.getElementById('mobile-sidebar-backdrop');

            if (openMobileBtn) openMobileBtn.addEventListener('click', () => {
                mobileSidebar.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
                setTimeout(() => { backdrop.classList.add('opacity-100'); }, 10);
            });
            if (closeMobileBtn) closeMobileBtn.addEventListener('click', closeSidebar);
            if (backdrop) backdrop.addEventListener('click', closeSidebar);

            // Dark Mode Logic
            const htmlElement = document.documentElement;
            const themeBtn = document.getElementById('theme-toggle');
            
            if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                htmlElement.classList.add('dark');
                updateThemeIcons('dark');
            } else {
                htmlElement.classList.remove('dark');
                updateThemeIcons('light');
            }

            function updateThemeIcons(theme) {
                const iconDark = document.getElementById('theme-icon-dark');
                const iconLight = document.getElementById('theme-icon-light');
                if (theme === 'dark') {
                    if (iconDark) iconDark.classList.remove('hidden');
                    if (iconLight) iconLight.classList.add('hidden');
                } else {
                    if (iconDark) iconDark.classList.add('hidden');
                    if (iconLight) iconLight.classList.remove('hidden');
                }
            }

            if (themeBtn) {
                themeBtn.addEventListener('click', () => {
                    let activeTheme = 'light';
                    if (htmlElement.classList.contains('dark')) {
                        htmlElement.classList.remove('dark');
                        localStorage.setItem('color-theme', 'light');
                    } else {
                        htmlElement.classList.add('dark');
                        localStorage.setItem('color-theme', 'dark');
                        activeTheme = 'dark';
                    }
                    updateThemeIcons(activeTheme);
                });
            }
        }

        function initPage(tabId) {
            const titleMap = {
                'overview': 'Analytics Overview',
                'themes': 'Digital Themes Management',
                'users': 'User Management',
                'transactions': 'Transaction History Log',
                'settings': 'Dashboard Settings',
                'form': 'Form Elements Preview',
                'form-wizard': 'Form Wizard Stepper',
                'select': 'Select Elements Preview',
                'datepicker': 'Date & Time Pickers',
                'modal': 'Interactive Modals Preview',
                'alert': 'Alert Panels & Badges'
            };
            
            const pageTitle = document.getElementById('page-title');
            if (pageTitle) {
                pageTitle.innerText = titleMap[tabId] || 'Dashboard';
            }

            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach(btn => {
                if (btn.getAttribute('data-tab') === tabId) {
                    btn.classList.add('sidebar-item-active');
                } else {
                    btn.classList.remove('sidebar-item-active');
                }
            });
        }

        // DATABASE SIMULATION
        const initialUsers = [
            { name: 'Hasrul', email: 'hasrul@aitthemes.com', role: 'Admin', status: 'Active', date: '2026-01-10', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=64&q=80' },
            { name: 'Budi Sutrisno', email: 'budi.sutrisno@gmail.com', role: 'Member', status: 'Active', date: '2026-03-15', avatar: 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=64&q=80' },
            { name: 'Siti Aminah', email: 'siti.aminah@yahoo.com', role: 'Member', status: 'Inactive', date: '2026-04-02', avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=64&q=80' },
            { name: 'Roni Hidayat', email: 'roni.hidayat@outlook.com', role: 'Editor', status: 'Active', date: '2026-02-28', avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=64&q=80' },
            { name: 'Diana Putri', email: 'diana.putri@gmail.com', role: 'Member', status: 'Active', date: '2026-05-12', avatar: 'https://images.unsplash.com/photo-1438761681033-6461ffad8d80?auto=format&fit=crop&w=64&q=80' }
        ];

        function getDB(key, defaults) {
            if (!localStorage.getItem(key)) {
                localStorage.setItem(key, JSON.stringify(defaults));
            }
            return JSON.parse(localStorage.getItem(key));
        }

        function saveDB(key, data) {
            localStorage.setItem(key, JSON.stringify(data));
        }

        let users = getDB('ait_users', initialUsers);

        function initProfileDisplay() {
            const adminUser = users.find(u => u.role === 'Admin') || users[0];
            const userName = adminUser.name;
            const userAvatar = adminUser.avatar;

            document.getElementById('mobile-user-name').innerText = userName;
            document.getElementById('desktop-user-name').innerText = userName;
            document.getElementById('header-user-name').innerText = userName;
            
            document.getElementById('mobile-user-avatar').src = userAvatar;
            document.getElementById('desktop-user-avatar').src = userAvatar;
            document.getElementById('header-user-avatar').src = userAvatar;
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-2xl shadow-xl flex items-center gap-3 bg-white dark:bg-slate-800 border border-slate-200/50 dark:border-slate-700/50 text-slate-800 dark:text-white text-sm pointer-events-auto fade-in transition-all duration-300`;
            
            let iconMarkup = '';
            if (type === 'success') {
                iconMarkup = `<div class="w-8 h-8 rounded-xl bg-emerald-100 dark:bg-emerald-950 flex items-center justify-center text-emerald-600 dark:text-emerald-400 shrink-0"><i data-lucide="check-circle" class="w-5 h-5"></i></div>`;
            } else if (type === 'warning') {
                iconMarkup = `<div class="w-8 h-8 rounded-xl bg-amber-100 dark:bg-amber-950 flex items-center justify-center text-amber-600 dark:text-amber-400 shrink-0"><i data-lucide="alert-triangle" class="w-5 h-5"></i></div>`;
            } else {
                iconMarkup = `<div class="w-8 h-8 rounded-xl bg-rose-100 dark:bg-rose-950 flex items-center justify-center text-rose-600 dark:text-rose-400 shrink-0"><i data-lucide="alert-circle" class="w-5 h-5"></i></div>`;
            }

            toast.innerHTML = `
                ${iconMarkup}
                <div class="flex-1 font-medium">${message}</div>
                <button class="text-slate-400 hover:text-slate-600 dark:hover:text-white" onclick="this.parentElement.remove()">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            `;

            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => { toast.remove(); }, 300);
            }, 4000);
        }

        // USERS METHODS
        function renderUsers() {
            const tbody = document.getElementById('users-table-tbody');
            const search = document.getElementById('user-search').value.toLowerCase();
            const filter = document.getElementById('user-role-filter').value;
            tbody.innerHTML = '';

            let filtered = users.filter(u => u.name.toLowerCase().includes(search) || u.email.toLowerCase().includes(search));
            if (filter !== 'All') {
                filtered = filtered.filter(u => u.role === filter);
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="py-12 text-center text-slate-400">
                            <i data-lucide="frown" class="w-10 h-10 mx-auto mb-2"></i>
                            User not found.
                        </td>
                    </tr>
                `;
                lucide.createIcons();
                return;
            }

            filtered.forEach(u => {
                const statusBadge = u.status === 'Active' 
                    ? 'bg-emerald-50 text-emerald-600 dark:bg-emerald-950/30 dark:text-emerald-400 border-emerald-100 dark:border-emerald-900/30'
                    : 'bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400 border-slate-200 dark:border-slate-700/50';

                const roleBadge = u.role === 'Admin'
                    ? 'bg-blue-50 text-blue-600 dark:bg-blue-950/30 dark:text-blue-400 border-blue-100 dark:border-blue-900/30'
                    : u.role === 'Editor'
                    ? 'bg-indigo-50 text-indigo-600 dark:bg-indigo-950/30 dark:text-indigo-400 border-indigo-100 dark:border-indigo-900/30'
                    : 'bg-slate-50 text-slate-600 dark:bg-slate-900/30 dark:text-slate-300 border-slate-200 dark:border-slate-700/30';

                tbody.innerHTML += `
                    <tr class="border-b border-slate-100 dark:border-slate-700/50 hover:bg-slate-50/50 dark:hover:bg-slate-850/50">
                        <td class="py-3.5 px-6">
                            <div class="flex items-center gap-3">
                                <img src="${u.avatar}" alt="Avatar" class="w-9 h-9 rounded-xl object-cover">
                                <div>
                                    <h5 class="font-semibold text-slate-800 dark:text-white">${u.name}</h5>
                                    <p class="text-xs text-slate-400">${u.email}</p>
                                </div>
                            </div>
                        </td>
                        <td class="py-3.5 px-6">
                            <span class="px-2 py-0.5 text-xs border rounded-md font-medium ${roleBadge}">${u.role}</span>
                        </td>
                        <td class="py-3.5 px-6">
                            <span class="px-2 py-0.5 text-xs border rounded-md font-medium ${statusBadge}">${u.status}</span>
                        </td>
                        <td class="py-3.5 px-6">${u.date}</td>
                        <td class="py-3.5 px-6 text-center">
                            <div class="flex justify-center gap-1.5">
                                <button onclick="openEditUserModal('${u.email}')" class="p-1.5 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                                    <i data-lucide="edit" class="w-4 h-4"></i>
                                </button>
                                <button onclick="deleteUser('${u.email}')" class="p-1.5 border border-rose-200 dark:border-rose-950/20 rounded-lg text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-900/10 transition-colors">
                                    <i data-lucide="user-minus" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            lucide.createIcons();
        }

        const userModal = document.getElementById('user-modal');
        const userModalCard = document.getElementById('user-modal-card');

        function openEditUserModal(email) {
            const u = users.find(item => item.email === email);
            if (!u) return;

            document.getElementById('user-form-email').value = u.email;
            document.getElementById('user-form-email-display').value = u.email;
            document.getElementById('user-form-name').value = u.name;
            document.getElementById('user-form-role').value = u.role;
            document.getElementById('user-form-status').value = u.status;

            userModal.classList.remove('hidden');
            setTimeout(() => {
                userModalCard.classList.remove('scale-95', 'opacity-0');
            }, 50);
        }

        function closeUserModal() {
            userModalCard.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                userModal.classList.add('hidden');
            }, 250);
        }

        function saveUserForm(e) {
            e.preventDefault();
            const email = document.getElementById('user-form-email').value;
            const name = document.getElementById('user-form-name').value;
            const role = document.getElementById('user-form-role').value;
            const status = document.getElementById('user-form-status').value;

            users = users.map(u => u.email === email ? { ...u, name, role, status } : u);
            saveDB('ait_users', users);
            closeUserModal();
            renderUsers();
            initProfileDisplay(); 
            showToast(`User data for "${name}" successfully updated.`, 'success');
        }

        function deleteUser(email) {
            const u = users.find(item => item.email === email);
            if (!u) return;

            if (u.role === 'Admin') {
                showToast("Main Admin role cannot be deleted!", "error");
                return;
            }

            if (confirm(`Are you sure you want to delete the account "${u.name}"?`)) {
                users = users.filter(item => item.email !== email);
                saveDB('ait_users', users);
                showToast(`Account "${u.name}" successfully deleted.`, 'warning');
                renderUsers();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const isMinimized = localStorage.getItem('sidebar-minimized') === 'true';
            if (isMinimized) {
                document.body.classList.add('sidebar-minimized');
            }

            const cb = window.location.protocol.startsWith('http') ? '?v=' + new Date().getTime() : '';
            Promise.all([
                fetch('component/sidebar.html' + cb).then(res => res.text()),
                fetch('component/navbar.html' + cb).then(res => res.text()),
                fetch('component/footer.html' + cb).then(res => res.text())
            ])
            .then(([sidebarData, navbarData, footerData]) => {
                document.getElementById('sidebar-placeholder').innerHTML = sidebarData;
                document.getElementById('navbar-placeholder').innerHTML = navbarData;
                document.getElementById('footer-placeholder').innerHTML = footerData;

                if (isMinimized) {
                    const icon = document.getElementById('minimize-icon');
                    if (icon) {
                        icon.setAttribute('data-lucide', 'chevron-right');
                    }
                }

                initAdminControls();
                initPage('users');
                initProfileDisplay();
                renderUsers();
            })
            .catch(error => {
                console.error('Error loading admin components:', error);
                initProfileDisplay();
                renderUsers();
            });
        });
    </script>
</body>
</html>
