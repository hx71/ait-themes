<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Preview - AIT Themes</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#2563eb', // Blue-600
                        secondary: '#4f46e5', // Indigo-600
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS for Scrollbars & Animations -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .sidebar-item-active {
            background-color: #eff6ff;
            color: #2563eb;
            font-weight: 600;
            border-left: 4px solid #2563eb;
        }
        .dark .sidebar-item-active {
            background-color: rgba(37, 99, 235, 0.15);
            color: #60a5fa;
            border-left: 4px solid #3b82f6;
        }

        /* Sidebar Minimized state */
        @media (min-width: 1024px) {
            body.sidebar-minimized #desktop-sidebar {
                width: 5rem; /* w-20 */
            }
            body.sidebar-minimized #main-content-wrapper {
                padding-left: 5rem; /* lg:pl-20 */
            }
            body.sidebar-minimized #desktop-sidebar #desktop-logo-text,
            body.sidebar-minimized #desktop-sidebar nav span,
            body.sidebar-minimized #desktop-sidebar .tab-btn-text,
            body.sidebar-minimized #desktop-sidebar #desktop-user-info,
            body.sidebar-minimized #desktop-sidebar #desktop-logout-text {
                display: none;
            }
            body.sidebar-minimized #desktop-sidebar .tab-btn {
                justify-content: center;
                padding-left: 0;
                padding-right: 0;
                gap: 0;
            }
            body.sidebar-minimized #desktop-sidebar #desktop-user-card {
                justify-content: center;
                padding: 0.5rem;
            }
            body.sidebar-minimized #desktop-sidebar #desktop-logout-btn {
                justify-content: center;
                padding: 0.5rem;
                width: 2.75rem;
                height: 2.75rem;
                border-radius: 9999px;
            }
            body.sidebar-minimized #desktop-sidebar .h-16 {
                justify-content: center;
                padding-left: 0;
                padding-right: 0;
            }
            body.sidebar-minimized #desktop-sidebar #minimize-sidebar-btn {
                position: absolute;
                right: -0.75rem;
                top: 1.25rem;
                background-color: white;
                border: 1px solid rgb(226, 232, 240);
                box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
                z-index: 50;
                border-radius: 9999px;
            }
            body.sidebar-minimized.dark #desktop-sidebar #minimize-sidebar-btn {
                background-color: rgb(30, 41, 59);
                border-color: rgb(51, 65, 85);
                box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.5);
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-50 font-sans antialiased transition-colors duration-300">

    <!-- Sidebar Placeholder -->
    <div id="sidebar-placeholder"></div>

    <!-- Main Content Wrapper -->
    <div id="main-content-wrapper" class="lg:pl-64 flex flex-col min-h-screen bg-slate-50 dark:bg-slate-900 transition-all duration-300">
        
        <!-- Top Navbar Header Placeholder -->
        <div id="navbar-placeholder"></div>

        <!-- Main Content Area -->
        <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto space-y-6">

            <!-- ================= TAB 7: SELECT (UTILITIES) ================= -->
            <section id="tab-select" class="tab-pane fade-in space-y-6">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    
                    <!-- Basic Select Cards -->
                    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200/50 dark:border-slate-700/50 shadow-sm space-y-6">
                        <h4 class="font-bold text-slate-800 dark:text-white mb-2 flex items-center gap-2">
                            <i data-lucide="list" class="w-5 h-5 text-blue-600"></i> Standard Select Options
                        </h4>
                        <p class="text-xs text-slate-500 dark:text-slate-400">Regular HTML dropdown selectors styled for light and dark modes.</p>
                        
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Basic Select Dropdown</label>
                                <select class="block w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                                    <option value="">Choose an option...</option>
                                    <option value="saas">SaaS Landing Page</option>
                                    <option value="ecommerce">E-commerce Portal</option>
                                    <option value="portfolio">Creative Portfolio</option>
                                </select>
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Disabled Select Dropdown</label>
                                <select disabled class="block w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-900/50 text-slate-400 cursor-not-allowed outline-none">
                                    <option value="">Selection is locked</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Multiple Select Listbox</label>
                                <select multiple class="block w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all h-28">
                                    <option value="react" selected>React JS Framework</option>
                                    <option value="vue">Vue JS Framework</option>
                                    <option value="tailwind" selected>Tailwind CSS styling</option>
                                    <option value="node">Node JS Backend</option>
                                </select>
                                <p class="text-[10px] text-slate-400 mt-1">Hold Down Ctrl/Cmd to select multiple options.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Custom Dropdown Card -->
                    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200/50 dark:border-slate-700/50 shadow-sm space-y-6">
                        <h4 class="font-bold text-slate-800 dark:text-white mb-2 flex items-center gap-2">
                            <i data-lucide="check" class="w-5 h-5 text-indigo-600"></i> Interactive Custom Dropdown
                        </h4>
                        <p class="text-xs text-slate-500 dark:text-slate-400">Simulated dropdown component with dynamic select item callback.</p>
                        
                        <div class="relative w-full">
                            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Select Role</label>
                            
                            <!-- Custom Select Trigger Button -->
                            <button id="custom-select-btn" type="button" onclick="document.getElementById('custom-dropdown-list').classList.toggle('hidden')" class="w-full flex items-center justify-between px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all text-left">
                                <span id="custom-select-label" class="flex items-center gap-2">
                                    <i data-lucide="shield" class="w-4 h-4 text-blue-500"></i> Administrator
                                </span>
                                <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
                            </button>

                            <!-- Dropdown List Options -->
                            <div id="custom-dropdown-list" class="absolute z-10 w-full mt-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-lg hidden">
                                <div class="p-1.5 space-y-1">
                                    <button type="button" onclick="selectCustomOption('Administrator', 'shield')" class="w-full flex items-center gap-2 px-3 py-2 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg text-left">
                                        <i data-lucide="shield" class="w-4 h-4 text-blue-500"></i> Administrator
                                    </button>
                                    <button type="button" onclick="selectCustomOption('Editor', 'edit-2')" class="w-full flex items-center gap-2 px-3 py-2 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg text-left">
                                        <i data-lucide="edit-2" class="w-4 h-4 text-indigo-500"></i> Editor
                                    </button>
                                    <button type="button" onclick="selectCustomOption('Member Subscriber', 'user')" class="w-full flex items-center gap-2 px-3 py-2 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg text-left">
                                        <i data-lucide="user" class="w-4 h-4 text-emerald-500"></i> Member Subscriber
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Footer Placeholder -->
            <div id="footer-placeholder"></div>
        </main>
    </div>

    <!-- ================= SYSTEM TOAST NOTIFICATION ================= -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-[60] flex flex-col gap-3 pointer-events-none"></div>

    <script>
        function closeSidebar() {
            const mobileSidebar = document.getElementById('mobile-sidebar');
            const backdrop = document.getElementById('mobile-sidebar-backdrop');
            if (mobileSidebar && backdrop) {
                mobileSidebar.classList.add('-translate-x-full');
                backdrop.classList.remove('opacity-100');
                setTimeout(() => { backdrop.classList.add('hidden'); }, 300);
            }
        }

        function toggleSidebarMinimize() {
            const body = document.body;
            body.classList.toggle('sidebar-minimized');
            
            const isMinimized = body.classList.contains('sidebar-minimized');
            localStorage.setItem('sidebar-minimized', isMinimized ? 'true' : 'false');
            
            const icon = document.getElementById('minimize-icon');
            if (icon) {
                icon.setAttribute('data-lucide', isMinimized ? 'chevron-right' : 'chevron-left');
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }
        }

        function initAdminControls() {
            lucide.createIcons();
            const openMobileBtn = document.getElementById('open-mobile-sidebar-btn');
            const closeMobileBtn = document.getElementById('close-mobile-sidebar-btn');
            const mobileSidebar = document.getElementById('mobile-sidebar');
            const backdrop = document.getElementById('mobile-sidebar-backdrop');

            if (openMobileBtn) openMobileBtn.addEventListener('click', () => {
                mobileSidebar.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
                setTimeout(() => { backdrop.classList.add('opacity-100'); }, 10);
            });
            if (closeMobileBtn) closeMobileBtn.addEventListener('click', closeSidebar);
            if (backdrop) backdrop.addEventListener('click', closeSidebar);

            // Close custom dropdown on click outside
            document.addEventListener('click', (e) => {
                const btn = document.getElementById('custom-select-btn');
                const list = document.getElementById('custom-dropdown-list');
                if (btn && list && !btn.contains(e.target) && !list.contains(e.target)) {
                    list.classList.add('hidden');
                }
            });

            // Dark Mode Logic
            const htmlElement = document.documentElement;
            const themeBtn = document.getElementById('theme-toggle');
            
            if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                htmlElement.classList.add('dark');
                updateThemeIcons('dark');
            } else {
                htmlElement.classList.remove('dark');
                updateThemeIcons('light');
            }

            function updateThemeIcons(theme) {
                const iconDark = document.getElementById('theme-icon-dark');
                const iconLight = document.getElementById('theme-icon-light');
                if (theme === 'dark') {
                    if (iconDark) iconDark.classList.remove('hidden');
                    if (iconLight) iconLight.classList.add('hidden');
                } else {
                    if (iconDark) iconDark.classList.add('hidden');
                    if (iconLight) iconLight.classList.remove('hidden');
                }
            }

            if (themeBtn) {
                themeBtn.addEventListener('click', () => {
                    let activeTheme = 'light';
                    if (htmlElement.classList.contains('dark')) {
                        htmlElement.classList.remove('dark');
                        localStorage.setItem('color-theme', 'light');
                    } else {
                        htmlElement.classList.add('dark');
                        localStorage.setItem('color-theme', 'dark');
                        activeTheme = 'dark';
                    }
                    updateThemeIcons(activeTheme);
                });
            }
        }

        function initPage(tabId) {
            const titleMap = {
                'overview': 'Analytics Overview',
                'themes': 'Digital Themes Management',
                'users': 'User Management',
                'transactions': 'Transaction History Log',
                'settings': 'Dashboard Settings',
                'form': 'Form Elements Preview',
                'form-wizard': 'Form Wizard Stepper',
                'select': 'Select Elements Preview',
                'datepicker': 'Date & Time Pickers',
                'modal': 'Interactive Modals Preview',
                'alert': 'Alert Panels & Badges'
            };
            
            const pageTitle = document.getElementById('page-title');
            if (pageTitle) {
                pageTitle.innerText = titleMap[tabId] || 'Dashboard';
            }

            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach(btn => {
                if (btn.getAttribute('data-tab') === tabId) {
                    btn.classList.add('sidebar-item-active');
                } else {
                    btn.classList.remove('sidebar-item-active');
                }
            });
        }

        // DATABASE SIMULATION
        const initialUsers = [
            { name: 'Hasrul', email: 'hasrul@aitthemes.com', role: 'Admin', status: 'Active', date: '2026-01-10', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=64&q=80' }
        ];

        function getDB(key, defaults) {
            if (!localStorage.getItem(key)) {
                localStorage.setItem(key, JSON.stringify(defaults));
            }
            return JSON.parse(localStorage.getItem(key));
        }

        let users = getDB('ait_users', initialUsers);

        function initProfileDisplay() {
            const adminUser = users.find(u => u.role === 'Admin') || users[0];
            const userName = adminUser.name;
            const userAvatar = adminUser.avatar;

            document.getElementById('mobile-user-name').innerText = userName;
            document.getElementById('desktop-user-name').innerText = userName;
            document.getElementById('header-user-name').innerText = userName;
            
            document.getElementById('mobile-user-avatar').src = userAvatar;
            document.getElementById('desktop-user-avatar').src = userAvatar;
            document.getElementById('header-user-avatar').src = userAvatar;
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-2xl shadow-xl flex items-center gap-3 bg-white dark:bg-slate-800 border border-slate-200/50 dark:border-slate-700/50 text-slate-800 dark:text-white text-sm pointer-events-auto fade-in transition-all duration-300`;
            
            let iconMarkup = '';
            if (type === 'success') {
                iconMarkup = `<div class="w-8 h-8 rounded-xl bg-emerald-100 dark:bg-emerald-950 flex items-center justify-center text-emerald-600 dark:text-emerald-400 shrink-0"><i data-lucide="check-circle" class="w-5 h-5"></i></div>`;
            } else if (type === 'warning') {
                iconMarkup = `<div class="w-8 h-8 rounded-xl bg-amber-100 dark:bg-amber-950 flex items-center justify-center text-amber-600 dark:text-amber-400 shrink-0"><i data-lucide="alert-triangle" class="w-5 h-5"></i></div>`;
            } else {
                iconMarkup = `<div class="w-8 h-8 rounded-xl bg-rose-100 dark:bg-rose-950 flex items-center justify-center text-rose-600 dark:text-rose-400 shrink-0"><i data-lucide="alert-circle" class="w-5 h-5"></i></div>`;
            }

            toast.innerHTML = `
                ${iconMarkup}
                <div class="flex-1 font-medium">${message}</div>
                <button class="text-slate-400 hover:text-slate-600 dark:hover:text-white" onclick="this.parentElement.remove()">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            `;

            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => { toast.remove(); }, 300);
            }, 4000);
        }

        // Custom Select Dropdown Handler
        function selectCustomOption(label, iconName) {
            document.getElementById('custom-select-label').innerHTML = `<i data-lucide="${iconName}" class="w-4 h-4 text-blue-500"></i> ${label}`;
            document.getElementById('custom-dropdown-list').classList.add('hidden');
            lucide.createIcons();
            showToast(`Role selected: ${label}`, 'success');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const isMinimized = localStorage.getItem('sidebar-minimized') === 'true';
            if (isMinimized) {
                document.body.classList.add('sidebar-minimized');
            }

            const cb = window.location.protocol.startsWith('http') ? '?v=' + new Date().getTime() : '';
            Promise.all([
                fetch('component/sidebar.html' + cb).then(res => res.text()),
                fetch('component/navbar.html' + cb).then(res => res.text()),
                fetch('component/footer.html' + cb).then(res => res.text())
            ])
            .then(([sidebarData, navbarData, footerData]) => {
                document.getElementById('sidebar-placeholder').innerHTML = sidebarData;
                document.getElementById('navbar-placeholder').innerHTML = navbarData;
                document.getElementById('footer-placeholder').innerHTML = footerData;

                if (isMinimized) {
                    const icon = document.getElementById('minimize-icon');
                    if (icon) {
                        icon.setAttribute('data-lucide', 'chevron-right');
                    }
                }

                initAdminControls();
                initPage('select');
                initProfileDisplay();
            })
            .catch(error => {
                console.error('Error loading admin components:', error);
                initProfileDisplay();
            });
        });
    </script>
</body>
</html>
