<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us - AIT Themes</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#2563eb', // Blue-600
                        secondary: '#4f46e5', // Indigo-600
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS for Animations -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-50 font-sans antialiased overflow-x-hidden transition-colors duration-300">

    <!-- Decorative Background Elements -->
    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-blue-400/20 dark:bg-blue-600/10 blur-[100px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-indigo-400/20 dark:bg-indigo-600/10 blur-[100px]"></div>
    </div>

    <!-- Placeholder for Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- About Section -->
    <section class="pt-32 pb-20 px-4 sm:px-6 lg:px-8 max-w-4xl mx-auto relative min-h-[70vh]">
        <div class="text-center reveal">
            <h1 class="text-4xl sm:text-5xl font-bold tracking-tight text-slate-900 dark:text-white mb-6">
                About <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-500">AIT Themes</span>
            </h1>
            <p class="text-lg text-slate-600 dark:text-slate-400 mb-8 leading-relaxed">
                We are a team of designers and developers dedicated to creating the best digital solutions. Our mission is to empower startups and creators through clean, minimalist, and functional designs.
            </p>
            <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80" alt="Our Team" class="w-full h-80 object-cover rounded-[2rem] shadow-xl border border-slate-200 dark:border-slate-700">
        </div>
    </section>

    <!-- Placeholder for Footer -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script>
        const cb = window.location.protocol.startsWith('http') ? '?v=' + new Date().getTime() : '';
        Promise.all([
            fetch('components/navbar.html' + cb).then(res => res.text()),
            fetch('components/footer.html' + cb).then(res => res.text())
        ])
        .then(([navbarData, footerData]) => {
            document.getElementById('navbar-placeholder').innerHTML = navbarData;
            document.getElementById('footer-placeholder').innerHTML = footerData;
            const script = document.createElement('script');
            script.src = 'assets/js/main.js';
            document.body.appendChild(script);
        })
        .catch(error => console.error('Error loading components:', error));
    </script>
</body>
</html>
