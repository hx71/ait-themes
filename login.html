<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AIT Themes</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#2563eb', // Blue-600
                        secondary: '#4f46e5', // Indigo-600
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS for Animations -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-50 font-sans antialiased overflow-x-hidden transition-colors duration-300 min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">

    <!-- Decorative Background Elements -->
    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-blue-400/20 dark:bg-blue-600/10 blur-[100px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-indigo-400/20 dark:bg-indigo-600/10 blur-[100px]"></div>
    </div>

    <div class="sm:mx-auto sm:w-full sm:max-w-md reveal">
        <!-- Logo -->
        <a href="index.html" class="flex items-center justify-center gap-2 cursor-pointer hover:opacity-80 transition-opacity mb-8">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-blue-500/30">
                A
            </div>
            <span class="font-bold text-2xl tracking-tight text-slate-900 dark:text-white">AIT Themes</span>
        </a>
        
        <h2 class="text-center text-3xl font-bold tracking-tight text-slate-900 dark:text-white">
            Sign in to your account
        </h2>
        <p class="mt-2 text-center text-sm text-slate-600 dark:text-slate-400">
            Or
            <a href="register.html" class="font-medium text-blue-600 hover:text-blue-500 dark:text-blue-400 dark:hover:text-blue-300 transition-colors">
                register a new account
            </a>
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md reveal delay-100">
        <div class="bg-white dark:bg-slate-800 py-8 px-4 shadow-xl border border-slate-200/50 dark:border-slate-700/50 sm:rounded-[2rem] sm:px-10">
            <form id="loginForm" class="space-y-6" action="admin/index.html" method="GET">
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">
                        Email Address
                    </label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="mail" class="h-5 w-5 text-slate-400"></i>
                        </div>
                        <input id="email" name="email" type="email" autocomplete="email" required class="block w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="name@email.com">
                    </div>
                </div>

                <div id="loginError" class="hidden text-sm text-rose-500 font-medium bg-rose-50 dark:bg-rose-500/10 p-3 rounded-xl border border-rose-200 dark:border-rose-500/30 flex items-center gap-2 transition-all">
                    <i data-lucide="alert-circle" class="w-4 h-4"></i> Incorrect email or password!
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">
                        Password
                    </label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="lock" class="h-5 w-5 text-slate-400"></i>
                        </div>
                        <input id="password" name="password" type="password" autocomplete="current-password" required class="block w-full pl-10 pr-10 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="••••••••">
                        <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors focus:outline-none">
                            <i data-lucide="eye" id="toggleIcon" class="h-5 w-5"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 rounded cursor-pointer">
                        <label for="remember-me" class="ml-2 block text-sm text-slate-700 dark:text-slate-300 cursor-pointer">
                            Remember me
                        </label>
                    </div>

                    <div class="text-sm">
                        <a href="forgot-password.html" class="font-medium text-blue-600 hover:text-blue-500 dark:text-blue-400 dark:hover:text-blue-300 transition-colors">
                            Forgot password?
                        </a>
                    </div>
                </div>

                <div>
                    <button type="submit" class="w-full flex justify-center py-3.5 px-4 rounded-xl shadow-lg shadow-blue-500/30 text-sm font-medium text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-300 transform hover:-translate-y-0.5">
                        Sign In
                    </button>
                </div>
            </form>

            <div class="mt-6">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-slate-200 dark:border-slate-700"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400">
                            Or continue with
                        </span>
                    </div>
                </div>

                <div class="mt-6 grid grid-cols-2 gap-3">
                    <div>
                        <a href="#" class="w-full inline-flex justify-center py-2.5 px-4 border border-slate-200 dark:border-slate-700 rounded-xl shadow-sm bg-white dark:bg-slate-900 text-sm font-medium text-slate-500 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                            <span class="sr-only">Sign in with Google</span>
                            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                        </a>
                    </div>

                    <div>
                        <a href="#" class="w-full inline-flex justify-center py-2.5 px-4 border border-slate-200 dark:border-slate-700 rounded-xl shadow-sm bg-white dark:bg-slate-900 text-sm font-medium text-slate-500 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                            <span class="sr-only">Sign in with GitHub</span>
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd" />
                            </svg>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Dark Mode Toggle untuk Login -->
    <button id="theme-toggle-login" class="fixed bottom-8 right-8 p-3 rounded-full bg-white dark:bg-slate-800 shadow-lg border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition-all z-50">
        <i data-lucide="moon" id="theme-icon-dark-login" class="w-5 h-5 hidden"></i>
        <i data-lucide="sun" id="theme-icon-light-login" class="w-5 h-5"></i>
    </button>

    <!-- Script Inline (Karena tidak ada navbar/footer, kita atur script terpisah) -->
    <script src="assets/js/main.js"></script>
    <script>
        const htmlLogin = document.documentElement;
        const loginToggleBtn = document.getElementById('theme-toggle-login');
        
        loginToggleBtn.addEventListener('click', () => {
            if (htmlLogin.classList.contains('dark')) {
                htmlLogin.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
                document.getElementById('theme-icon-dark-login').classList.add('hidden');
                document.getElementById('theme-icon-light-login').classList.remove('hidden');
            } else {
                htmlLogin.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
                document.getElementById('theme-icon-dark-login').classList.remove('hidden');
                document.getElementById('theme-icon-light-login').classList.add('hidden');
            }
        });

        // Set initial icon state based on local storage / system preference
        if (htmlLogin.classList.contains('dark')) {
            document.getElementById('theme-icon-dark-login').classList.remove('hidden');
            document.getElementById('theme-icon-light-login').classList.add('hidden');
        }

        // Password Visibility Toggle Logic
        const togglePassword = document.getElementById('togglePassword');
        const password = document.getElementById('password');
        const toggleIcon = document.getElementById('toggleIcon');

        togglePassword.addEventListener('click', function () {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            toggleIcon.setAttribute('data-lucide', type === 'password' ? 'eye' : 'eye-off');
            lucide.createIcons(); // Re-render icons
        });

        // Login Error Warning Simulation Logic
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        const emailInput = document.getElementById('email');

        loginForm.addEventListener('submit', function (e) {
            // Simulation: If email is not admin@example.com or password is not password
            if (emailInput.value !== 'admin@example.com' || password.value !== 'password') {
                e.preventDefault(); // Prevent navigation
                
                // Show error message
                loginError.classList.remove('hidden');
                
                // Highlight inputs with a red border
                emailInput.classList.remove('border-slate-200', 'dark:border-slate-700', 'focus:ring-blue-500', 'focus:border-blue-500');
                emailInput.classList.add('border-rose-500', 'focus:ring-rose-500', 'focus:border-rose-500');
                
                password.classList.remove('border-slate-200', 'dark:border-slate-700', 'focus:ring-blue-500', 'focus:border-blue-500');
                password.classList.add('border-rose-500', 'focus:ring-rose-500', 'focus:border-rose-500');
                
                // Revert to original state after 3 seconds
                setTimeout(() => {
                    loginError.classList.add('hidden');
                    emailInput.classList.remove('border-rose-500', 'focus:ring-rose-500', 'focus:border-rose-500');
                    emailInput.classList.add('border-slate-200', 'dark:border-slate-700', 'focus:ring-blue-500', 'focus:border-blue-500');
                    password.classList.remove('border-rose-500', 'focus:ring-rose-500', 'focus:border-rose-500');
                    password.classList.add('border-slate-200', 'dark:border-slate-700', 'focus:ring-blue-500', 'focus:border-blue-500');
                }, 3000);
            }
        });
    </script>
</body>
</html>
